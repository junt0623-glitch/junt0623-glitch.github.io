<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ベクターデザイン工房</title>
<style>
:root{
  --ink:#17181c; --panel:#1f2127; --panel2:#25272e; --line:#2e313a;
  --text:#dcdee3; --muted:#8b909b; --accent:#d24a35; --accent-h:#e05a44;
  --canvas-bg:#2a2c33;
  /* 書体スタック（キャプション工房と共通仕様）。端末に入っているものが先頭から自動採用される */
  --mincho:"BIZ UDPMincho","BIZ UDPMincho Medium","BIZ UDMincho","BIZ UDMincho Medium","Hiragino Mincho ProN","YuMincho","Yu Mincho","Noto Serif JP","MS PMincho",serif;
  --gothic:"BIZ UDPGothic","BIZ UDGothic","Hiragino Kaku Gothic ProN","Yu Gothic Medium","YuGothic","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  --ud-mincho:"BIZ UDPMincho","BIZ UDPMincho Medium","BIZ UDMincho","BIZ UDMincho Medium","UD デジタル 教科書体 NP","UDデジタル教科書体 NP","UD Digi Kyokasho NP","UD デジタル 教科書体 NK","UD Digi Kyokasho NK","UD デジタル 教科書体 N","UD Digi Kyokasho N","UD デジタル 教科書体 NP-R","UD デジタル教科書体 NP-R","Hiragino Mincho ProN","Noto Serif JP",serif;
  --ud-gothic:"BIZ UDPGothic","BIZ UDGothic","UD デジタル 教科書体 NP","UDデジタル教科書体 NP","UD Digi Kyokasho NP","UD デジタル 教科書体 NK","UD Digi Kyokasho NK","UD デジタル 教科書体 N","UD Digi Kyokasho N","UD デジタル 教科書体 NP-R","UD デジタル教科書体 NP-R","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
  --biz-mincho:"BIZ UDPMincho","BIZ UDPMincho Medium","BIZ UDMincho","BIZ UDMincho Medium",serif;
  --biz-gothic:"BIZ UDPGothic","BIZ UDGothic","Meiryo",sans-serif;
  --ud-kyokasho:"UD デジタル 教科書体 NP","UDデジタル教科書体 NP","UD Digi Kyokasho NP","UD デジタル 教科書体 NK","UD Digi Kyokasho NK","UD デジタル 教科書体 N","UD Digi Kyokasho N","UD デジタル 教科書体 NP-R","UDデジタル教科書体 NP-R","UD Digi Kyokasho NP-R","BIZ UDPMincho","BIZ UDPMincho Medium","BIZ UDMincho","BIZ UDMincho Medium",serif;
  --ud-kyokasho-b:"UD デジタル 教科書体 NP","UDデジタル教科書体 NP","UD Digi Kyokasho NP","UD デジタル 教科書体 NP-B","UDデジタル教科書体 NP-B","UD Digi Kyokasho NP-B","BIZ UDPMincho","BIZ UDPMincho Medium",serif;
  --kaisho:"HG正楷書体-PRO","HGP正楷書体","Kaisho","AR PL UKai TW","BIZ UDPMincho",serif;
  --yu-mincho:"YuMincho","Yu Mincho","游明朝","BIZ UDPMincho",serif;
  --hiragino-mincho:"Hiragino Mincho ProN","ヒラギノ明朝 ProN","BIZ UDPMincho",serif;
  --ms-mincho:"MS PMincho","ＭＳ Ｐ明朝","MS Mincho",serif;
  --yu-gothic:"Yu Gothic Medium","YuGothic","Yu Gothic","游ゴシック","BIZ UDPGothic",sans-serif;
  --hiragino-gothic:"Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN","BIZ UDPGothic",sans-serif;
  --meiryo:"Meiryo","メイリオ","BIZ UDPGothic",sans-serif;
  --ms-gothic:"MS PGothic","ＭＳ Ｐゴシック","MS Gothic",sans-serif;
  --ms-ui-gothic:"MS UI Gothic","ＭＳ UI Gothic","MS PGothic",sans-serif;
  --noto-serif-jp:"Noto Serif JP","BIZ UDPMincho",serif;
  --noto-sans-jp:"Noto Sans JP","BIZ UDPGothic",sans-serif;
  --en-sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --en-serif:"Georgia","Times New Roman",serif;
  --georgia:"Georgia",serif;
  --times:"Times New Roman",serif;
  --helvetica:"Helvetica Neue","Helvetica",Arial,sans-serif;
  --segoe:"Segoe UI",sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",Meiryo,sans-serif;
  background:var(--ink); color:var(--text); font-size:13px;
  display:flex; flex-direction:column;
}
button{font-family:inherit; font-size:12px; color:var(--text); background:var(--panel2);
  border:1px solid var(--line); border-radius:4px; padding:4px 9px; cursor:pointer;}
button:hover{background:#2d3039; border-color:#3a3e49;}
button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
button.primary{background:var(--accent); border-color:var(--accent);}
button.primary:hover{background:var(--accent-h);}
input,select,textarea{font-family:inherit; font-size:12px; color:var(--text);
  background:#191b20; border:1px solid var(--line); border-radius:4px; padding:3px 6px;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
input[type=color]{padding:1px; width:34px; height:24px; cursor:pointer;}
input[type=number]{width:58px;}
input[type=checkbox]{accent-color:var(--accent);}
input[type=range]{accent-color:var(--accent);}

/* ===== 上部バー ===== */
#topbar{
  display:flex; align-items:center; gap:8px; padding:6px 10px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap;
}
#logo{display:flex; align-items:center; gap:8px; margin-right:6px;}
#seal{width:26px; height:26px; background:var(--accent); color:#fff; border-radius:3px;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);}
#appname{font-weight:700; letter-spacing:.05em; font-size:13px;}
#fname{width:150px;}
.sep{width:1px; height:20px; background:var(--line); margin:0 2px;}
#zoomLabel{min-width:48px; text-align:center; color:var(--muted);}
.toggle{display:flex; align-items:center; gap:4px; color:var(--muted); cursor:pointer; user-select:none;}

/* ===== 中央レイアウト ===== */
#main{flex:1 1 auto; display:flex; min-height:0;}
#toolbar{
  flex:0 0 46px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; overflow-y:auto;
}
.tbtn{width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; border-radius:6px; position:relative;}
.tbtn svg{width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.tbtn:hover{background:var(--panel2);}
.tbtn.active{background:#3a2320; border-color:var(--accent);}
.tbtn.active svg{stroke:var(--accent-h);}

#canvasWrap{flex:1 1 auto; position:relative; background:var(--canvas-bg); overflow:hidden;}
#stage{width:100%; height:100%; display:block; touch-action:none;}
#stage.tool-select{cursor:default;}
#stage.tool-hand{cursor:grab;}
#stage.panning{cursor:grabbing !important;}
#stage.tool-rect,#stage.tool-ellipse,#stage.tool-line,#stage.tool-poly,#stage.tool-star,#stage.tool-pen,#stage.tool-pencil,#stage.tool-node,#stage.tool-picker{cursor:crosshair;}
#stage.tool-text{cursor:text;}

#textEditor{position:absolute; display:none; z-index:20;}
#textEditor textarea{background:#fff; color:#111; border:2px solid var(--accent);
  border-radius:3px; padding:3px 5px; box-shadow:0 2px 10px rgba(0,0,0,.45);
  min-width:120px; min-height:30px; resize:both; line-height:1.35; overflow:hidden;}
/* 文字入力欄: 既定で中身の行数に合わせて高さが伸びる（縦スクロールを出さない） */
/* min-width:0 が無いと、長い行の最小内容幅がパネル全体を押し広げてしまう */
.prow textarea{font-size:13px; line-height:1.6; padding:5px 7px; resize:vertical;
  min-height:34px; min-width:0; overflow:hidden; background:#1a1c22; color:#f0f2f6;}
.prow textarea:focus{background:#12141a;}

/* ===== 右パネル ===== */
/* min-width:0 が無いと中身の最小内容幅（長い文字列など）で248pxを超えて広がり、画面が狭くなる */
#side{flex:0 0 248px; min-width:0; background:var(--panel); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;}
.paneltitle{padding:7px 10px; font-weight:700; font-size:12px; letter-spacing:.06em;
  color:var(--muted); border-bottom:1px solid var(--line); background:var(--panel2);}
#props{flex:0 0 auto; max-height:55%; overflow-y:auto; padding:10px; border-bottom:1px solid var(--line);}
.prow{display:flex; align-items:center; gap:6px; margin-bottom:7px; flex-wrap:wrap;}
.prow label{color:var(--muted); min-width:34px; font-size:11px;}
.pgroup{border-top:1px dashed var(--line); margin-top:8px; padding-top:8px;}
/* 数値調整（キャプション工房と共通仕様）: スライダーで即時反映し、値は等幅数字で右詰め表示 */
.prow input[type=range]{flex:1; min-width:80px; accent-color:var(--accent);}
.prow output{font-size:11px; color:var(--text); min-width:52px; text-align:right;
  font-variant-numeric:tabular-nums;}
.fontwarn{font-size:10px; line-height:1.6; color:#e8a33d; flex:1 1 100%;}
.fontdiag{font-size:10px; line-height:1.7; color:var(--muted); flex:1 1 100%;
  max-height:120px; overflow:auto;}
.fontpreview{flex:1; min-width:0; font-size:15px; padding:3px 6px; border:1px solid var(--line);
  border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--panel2);}
.minibtns{display:flex; gap:4px; flex-wrap:wrap;}
.minibtns button{padding:3px 6px; font-size:11px;}
#layersWrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
#layers{flex:1 1 auto; overflow-y:auto;}
.layer{display:flex; align-items:center; gap:5px; padding:4px 8px; border-bottom:1px solid #23252b; cursor:pointer;}
.layer:hover{background:var(--panel2);}
.layer.sel{background:#3a2320; box-shadow:inset 2px 0 0 var(--accent);}
.layer .lname{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.layer .lname input{width:100%;}
.lic{width:20px; height:20px; padding:0; background:transparent; border:none; display:flex;
  align-items:center; justify-content:center; color:var(--muted); font-size:12px;}
.lic:hover{color:var(--text); background:transparent;}
.lic svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6;}
.lic.off{opacity:.35;}
.layer.layerhead{background:#20242c;}
.layer.layerhead.active{box-shadow:inset 3px 0 0 var(--accent); background:#2c2621;}
.layer.layerhead .lname{font-weight:600;}
.layer.layerobj{padding-left:14px;}
.layer.layerobj .lname{font-size:12px;}
.layer .ltri{width:15px; height:20px; padding:0; background:transparent; border:none;
  color:var(--muted); cursor:pointer; font-size:9px; display:flex; align-items:center; justify-content:center;}
.layer .ltri:hover{color:var(--text);}
.layer .ldel:hover{color:var(--accent-h);}
#layerHead{display:flex; align-items:center; justify-content:space-between;}
#btnAddLayer{padding:0 8px; font-size:15px; line-height:1.4;}
.cmykrow{gap:2px; margin-top:-3px; margin-bottom:8px;}
.cmykrow .cmyklab{min-width:0; color:var(--muted); font-size:10px; margin-left:3px;}
.cmykrow input[type=number]{width:34px; padding:2px 3px;}

/* ===== カラースウォッチ＆ドラッグ式ピッカー ===== */
.swatch{position:relative; width:34px; height:24px; padding:0; border:1px solid var(--line);
  border-radius:4px; overflow:hidden; cursor:pointer;
  background-image:
    linear-gradient(45deg,#bbb 25%,transparent 25%),
    linear-gradient(-45deg,#bbb 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#bbb 75%),
    linear-gradient(-45deg,transparent 75%,#bbb 75%);
  background-size:10px 10px; background-position:0 0,0 5px,5px -5px,-5px 0px; background-color:#fff;}
.swatch:disabled{cursor:default; opacity:.5;}
.swatch .swatch-fill{position:absolute; inset:0;}
.colorpop{position:fixed; z-index:60; background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,.5); width:176px;}
.cp-sv{position:relative; width:100%; height:120px; border-radius:4px; cursor:crosshair; margin-bottom:10px; touch-action:none;}
.cp-hue{position:relative; width:100%; height:14px; border-radius:7px; cursor:pointer; margin-bottom:10px; touch-action:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
.cp-thumb{position:absolute; width:14px; height:14px; border-radius:50%; border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.5); transform:translate(-50%,-50%); pointer-events:none; top:50%;}
.cp-hexrow{display:flex; align-items:center; gap:4px;}
.cp-hexrow span{color:var(--muted);}
.cp-hexrow input{flex:1; text-transform:uppercase;}

/* ===== タッチ操作（iPad等） ===== */
button,select,.tbtn{touch-action:manipulation;}
#topbar,#toolbar,#side,#status{user-select:none; -webkit-user-select:none;}
#topbar input,#side input,#side textarea,#side select{user-select:auto; -webkit-user-select:auto;}

/* ===== ステータスバー ===== */
#status{flex:0 0 auto; display:flex; gap:16px; padding:4px 12px; background:var(--panel);
  border-top:1px solid var(--line); color:var(--muted); font-size:11px;}
#hint{flex:1;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<header id="topbar">
  <div id="logo"><div id="seal">画</div><span id="appname">ベクターデザイン工房</span></div>
  <input id="fname" value="無題のデザイン" title="ファイル名">
  <label class="toggle" title="保存・書き出しのファイル名の末尾に、その日の日付（_YYYYMMDD）を付けます"><input type="checkbox" id="chkDateStamp" checked>日付</label>
  <span class="sep"></span>
  <button id="btnNew">新規</button>
  <button id="btnOpen">開く</button>
  <button id="btnImport">インポート</button>
  <button id="btnSave">保存 (.json)</button>
  <div id="exportWrap" style="position:relative; display:inline-block;">
    <button id="btnExport" class="primary">書き出し ▾</button>
    <div id="exportMenu" style="display:none; flex-direction:column; gap:2px; position:absolute; top:calc(100% + 2px); left:0; background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:4px; z-index:30; min-width:190px;">
      <button data-fmt="svg" style="text-align:left; width:100%;">SVG (.svg)</button>
      <button data-fmt="png" style="text-align:left; width:100%;">PNG (.png)</button>
      <button data-fmt="jpeg" style="text-align:left; width:100%;">JPEG (.jpg)</button>
      <button data-fmt="pdf" style="text-align:left; width:100%;">PDF (.pdf)</button>
      <label style="display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); border-top:1px solid var(--line); margin-top:2px; padding-top:4px; white-space:nowrap;">解像度
        <select id="expScale" style="flex:1" title="PNG/JPEG/PDF の書き出し倍率。数値が大きいほど高精細（ファイルも大きく）">
          <option value="1">×1 (96dpi)</option>
          <option value="2" selected>×2 (192dpi)</option>
          <option value="3">×3 (288dpi)</option>
          <option value="4">×4 (384dpi)</option>
          <option value="6">×6 (576dpi)</option>
          <option value="8">×8 (768dpi)</option>
          <option value="native">配置画像の原寸に合わせる</option>
        </select></label>
      <span id="expSizeHint" style="font-size:10px; color:var(--muted); padding:0 2px;"></span>
    </div>
  </div>
  <span class="sep"></span>
  <button id="btnUndo" title="元に戻す (Ctrl+Z)">↩ 戻す</button>
  <button id="btnRedo" title="やり直す (Ctrl+Y)">↪ 進む</button>
  <span class="sep"></span>
  <button id="btnZoomOut" title="縮小 (Ctrl+−)">−</button>
  <span id="zoomLabel">100%</span>
  <button id="btnZoomIn" title="拡大 (Ctrl++)">＋</button>
  <button id="btnFit" title="全体表示 (Ctrl+0)">全体</button>
  <span class="sep"></span>
  <label class="toggle"><input type="checkbox" id="chkGrid">グリッド</label>
  <label class="toggle"><input type="checkbox" id="chkSnap">スナップ</label>
  <label class="toggle"><input type="checkbox" id="chkRuler" checked>定規</label>
  <label class="toggle" title="オンにすると作図後もツールが切り替わらず、同じ図形を続けて描けます"><input type="checkbox" id="chkKeepTool">連続作成</label>
</header>

<div id="main">
  <nav id="toolbar" aria-label="ツール"></nav>

  <div id="canvasWrap">
    <svg id="stage">
      <defs>
        <pattern id="gridpat" width="20" height="20" patternUnits="userSpaceOnUse">
          <path id="gridpath" d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="1"/>
        </pattern>
      </defs>
      <defs id="gradDefs"></defs>
      <g id="world">
        <rect id="artboard" x="0" y="0" fill="#ffffff" style="filter:drop-shadow(0 3px 14px rgba(0,0,0,.45))"/>
        <rect id="gridRect" x="0" y="0" fill="url(#gridpat)" style="display:none" pointer-events="none"/>
        <g id="shapesLayer"></g>
        <g id="overlayLayer" pointer-events="none"></g>
        <g id="handleLayer"></g>
      </g>
      <g id="guideLayer"></g>
      <g id="rulerLayer"></g>
    </svg>
    <div id="textEditor"><textarea id="textArea" rows="1"></textarea></div>
  </div>

  <aside id="side">
    <div class="paneltitle">プロパティ</div>
    <div id="props"></div>
    <div id="layersWrap">
      <div class="paneltitle" id="layerHead"><span>レイヤー（上が前面）</span><button id="btnAddLayer" title="新規レイヤーを追加">＋</button></div>
      <div id="layers"></div>
    </div>
  </aside>
</div>

<footer id="status"><span id="coords">x: 0, y: 0</span><span id="hint"></span></footer>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">
<input type="file" id="importInput" accept="image/*,.svg,.png,.jpg,.jpeg,.gif,.webp,.bmp,.avif,.ico,.tif,.tiff,.heic,.heif,.jxl" style="display:none">
<input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="display:none">
<datalist id="gfList">
  <option>Noto Sans JP</option><option>Noto Serif JP</option><option>M PLUS 1p</option>
  <option>M PLUS Rounded 1c</option><option>Zen Kaku Gothic New</option><option>Zen Maru Gothic</option>
  <option>Zen Old Mincho</option><option>Kosugi Maru</option><option>Sawarabi Mincho</option>
  <option>Sawarabi Gothic</option><option>Shippori Mincho</option><option>Kaisei Decol</option>
  <option>Yusei Magic</option><option>DotGothic16</option><option>Klee One</option>
  <option>RocknRoll One</option><option>Reggae One</option><option>Stick</option>
  <option>Roboto</option><option>Open Sans</option><option>Lato</option><option>Montserrat</option>
  <option>Oswald</option><option>Playfair Display</option><option>Lobster</option><option>Pacifico</option>
</datalist>

<script>
"use strict";
/* ================= 状態 ================= */
const state = {
  doc: {w:1200, h:800, bg:'#ffffff'},
  shapes: [],
  layers: [],           // 上位レイヤー [{id,name,visible,locked,collapsed}]（背面→前面）
  activeLayer: null,    // 新規オブジェクトの配置先レイヤーID
  sel: new Set(),
  tool: 'select',
  zoom: 1, panX: 40, panY: 40,
  grid: false, snap: false, gridSize: 20,
  ruler: true, guides: {v:[], h:[]},
  webFonts: [],         // 読み込み済みGoogle Fonts名
  customFonts: [],      // ファイルから読み込んだフォント [{name, data}]
};
const styleNow = {fill:'#d8d1c2', stroke:'#33312e', strokeWidth:2, opacity:1, fillAlpha:1, strokeAlpha:1};
let idSeq = 1;
let groupSeq = 1;
let layerSeq = 1;
const undoStack = [], redoStack = [];
let clipboard = [];
let drag = null;          // 進行中のドラッグ操作
let pen = null;           // ペンツールの作業中の点列
let spaceDown = false;
const touches = new Map(); // タッチ中のポインタ位置
let pinch = null;          // 2本指ピンチの状態
let lastTap = null;        // ダブルタップ検出用

const $ = id => document.getElementById(id);
const stage = $('stage'), world = $('world'), shapesLayer = $('shapesLayer'),
      overlayLayer = $('overlayLayer'), handleLayer = $('handleLayer');

/* ================= ユーティリティ ================= */
const deg2rad = d => d*Math.PI/180;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const snGrid = v => state.snap ? Math.round(v/state.gridSize)*state.gridSize : v;
function snapAxis(v, guides){
  const g0 = snGrid(v);
  if(state.ruler && guides.length){
    const thr = 6/state.zoom;
    for(const g of guides){ if(Math.abs(v-g)<thr) return g; }
  }
  return g0;
}
const snapX = v => snapAxis(v, state.guides.v);
const snapY = v => snapAxis(v, state.guides.h);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = v => Math.round(v*10)/10;

/* ---- 色変換（RGB / CMYK） ---- */
function hexToRgb(hex){
  let h = String(hex||'').replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  if(!isFinite(n)) return {r:0,g:0,b:0};
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function rgbToCmyk(r,g,b){
  r/=255; g/=255; b/=255;
  const k = 1 - Math.max(r,g,b);
  if(k>=1) return {c:0, m:0, y:0, k:100};
  const c = (1-r-k)/(1-k), m = (1-g-k)/(1-k), y = (1-b-k)/(1-k);
  return {c:Math.round(c*100), m:Math.round(m*100), y:Math.round(y*100), k:Math.round(k*100)};
}
function cmykToHex(c,m,y,k){
  c=clamp(c,0,100)/100; m=clamp(m,0,100)/100; y=clamp(y,0,100)/100; k=clamp(k,0,100)/100;
  return rgbToHex(255*(1-c)*(1-k), 255*(1-m)*(1-k), 255*(1-y)*(1-k));
}
function hexToHsv(hex){
  const {r,g,b} = hexToRgb(hex);
  const r1=r/255, g1=g/255, b1=b/255;
  const max=Math.max(r1,g1,b1), min=Math.min(r1,g1,b1), d=max-min;
  let h=0;
  if(d){
    if(max===r1) h=60*(((g1-b1)/d)%6);
    else if(max===g1) h=60*((b1-r1)/d+2);
    else h=60*((r1-g1)/d+4);
  }
  if(h<0) h+=360;
  return {h, s:max?d/max*100:0, v:max*100};
}
function hsvToHex(h,s,v){
  s/=100; v/=100;
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r1,g1,b1;
  if(h<60)[r1,g1,b1]=[c,x,0];
  else if(h<120)[r1,g1,b1]=[x,c,0];
  else if(h<180)[r1,g1,b1]=[0,c,x];
  else if(h<240)[r1,g1,b1]=[0,x,c];
  else if(h<300)[r1,g1,b1]=[x,0,c];
  else [r1,g1,b1]=[c,0,x];
  return rgbToHex((r1+m)*255, (g1+m)*255, (b1+m)*255);
}

/* ---- ドラッグ操作可能なカラーピッカー（彩度・明度・色相） ---- */
let colorPop = null;
function closeColorPop(){
  if(!colorPop) return;
  colorPop.el.remove();
  document.removeEventListener('pointerdown', colorPop.outside, true);
  colorPop = null;
}
function openColorPicker(anchor, hex, onLive){
  closeColorPop();
  const hsv = hexToHsv(hex==='none' ? '#000000' : hex);
  const pop = document.createElement('div');
  pop.className = 'colorpop';
  pop.innerHTML = `<div class="cp-sv"><div class="cp-thumb"></div></div>
    <div class="cp-hue"><div class="cp-thumb"></div></div>
    <div class="cp-hexrow"><span>#</span><input type="text" class="cp-hex" maxlength="6"></div>`;
  document.body.appendChild(pop);
  const ar = anchor.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  let left = ar.left, top = ar.bottom+4;
  if(left+pr.width > innerWidth-8) left = innerWidth-pr.width-8;
  if(top+pr.height > innerHeight-8) top = ar.top-pr.height-4;
  pop.style.left = left+'px'; pop.style.top = top+'px';

  const sv = pop.querySelector('.cp-sv'), svT = sv.querySelector('.cp-thumb');
  const hue = pop.querySelector('.cp-hue'), hueT = hue.querySelector('.cp-thumb');
  const hexInput = pop.querySelector('.cp-hex');

  function paint(){
    sv.style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), hsl(${fmt(hsv.h)}, 100%, 50%)`;
    svT.style.left = hsv.s+'%'; svT.style.top = (100-hsv.v)+'%';
    hueT.style.left = (hsv.h/360*100)+'%';
    hexInput.value = hsvToHex(hsv.h,hsv.s,hsv.v).slice(1).toUpperCase();
  }
  paint();
  function commit(){ onLive(hsvToHex(hsv.h,hsv.s,hsv.v)); paint(); }

  function dragOn(el, handler){
    el.addEventListener('pointerdown', e=>{
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const move = ev=>{ handler(ev); commit(); };
      move(e);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', ()=> el.removeEventListener('pointermove', move), {once:true});
    });
  }
  dragOn(sv, e=>{
    const b = sv.getBoundingClientRect();
    hsv.s = clamp((e.clientX-b.left)/b.width, 0, 1)*100;
    hsv.v = (1-clamp((e.clientY-b.top)/b.height, 0, 1))*100;
  });
  dragOn(hue, e=>{
    const b = hue.getBoundingClientRect();
    hsv.h = clamp((e.clientX-b.left)/b.width, 0, 1)*360;
  });
  hexInput.onchange = ()=>{
    const v = hexInput.value.trim();
    if(/^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(v)){
      const h2 = hexToHsv('#'+v);
      hsv.h=h2.h; hsv.s=h2.s; hsv.v=h2.v;
      commit();
    }else paint();
  };
  colorPop = {el:pop, outside: e=>{ if(!pop.contains(e.target) && !anchor.contains(e.target)) closeColorPop(); }};
  setTimeout(()=> document.addEventListener('pointerdown', colorPop.outside, true), 0);
}

/* ---- 上位レイヤー ---- */
function newLayer(name){
  return {id:'L'+(layerSeq++), name:name||('レイヤー '+(state.layers.length+1)), visible:true, locked:false, collapsed:false};
}
function ensureLayers(){
  if(!Array.isArray(state.layers) || !state.layers.length){
    state.layers = [newLayer('レイヤー 1')];
  }
  const ids = new Set(state.layers.map(l=>l.id));
  if(!state.activeLayer || !ids.has(state.activeLayer))
    state.activeLayer = state.layers[state.layers.length-1].id;
  const def = state.layers[0].id;
  state.shapes.forEach(s=>{ if(!s.layerId || !ids.has(s.layerId)) s.layerId = def; });
}
function layerOf(s){ return state.layers.find(l=>l.id===s.layerId); }
function shapeVisible(s){ const l = layerOf(s); return s.visible && (!l || l.visible); }
function shapeLocked(s){ const l = layerOf(s); return !!s.locked || !!(l && l.locked); }
function layerOrderIndex(id){ const i = state.layers.findIndex(l=>l.id===id); return i<0 ? state.layers.length : i; }
function normalizeOrder(){
  // レイヤー順で安定ソートし、state.shapes をレイヤーごとにまとめる（重ね順の一貫性を保つ）
  state.shapes.sort((a,b)=> layerOrderIndex(a.layerId) - layerOrderIndex(b.layerId));
}

function toWorld(e){
  const pt = stage.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(world.getScreenCTM().inverse());
}
function capture(e){ try{ capture(e); }catch(err){ /* 合成イベント等では失敗しても続行 */ } }
function toScreen(p){
  const pt = stage.createSVGPoint();
  pt.x = p.x; pt.y = p.y;
  const s = pt.matrixTransform(world.getScreenCTM());
  const r = $('canvasWrap').getBoundingClientRect();
  return {x: s.x - r.left, y: s.y - r.top};
}

/* ================= 図形定義 ================= */
const typeNames = {rect:'長方形', ellipse:'楕円', line:'直線', poly:'多角形', star:'星形', path:'パス', text:'テキスト', image:'画像'};

function newShape(type, extra){
  ensureLayers();
  const s = Object.assign({
    id: idSeq++, type, name: '', layerId: state.activeLayer,
    fill: styleNow.fill, stroke: styleNow.stroke, strokeWidth: styleNow.strokeWidth,
    opacity: styleNow.opacity, fillAlpha: styleNow.fillAlpha, strokeAlpha: styleNow.strokeAlpha,
    rotation: 0, visible: true, locked: false,
  }, extra);
  if(!s.name) s.name = (typeNames[s.star ? 'star' : type] || type) + ' ' + s.id;
  // 塗りも線も無いと画面に出ず、クリックもドラッグもできない図形になる。
  // 直前にテキスト（線なし）を扱うとstyleNow.strokeがnoneになるため、ここで線を戻す。
  // 線(line)はfillが効かないので、塗りの有無にかかわらず線が必要。
  const needsStroke = (type==='line') || (s.fill==='none' || s.fill==null);
  if(type!=='text' && type!=='image' && s.stroke==='none' && needsStroke){
    s.stroke = (styleNow.stroke!=='none' && styleNow.stroke) || '#33312e';
    if(!(s.strokeWidth > 0)) s.strokeWidth = 2;
  }
  return s;
}

function polyPoints(s){
  const pts = [], n = s.star ? s.sides*2 : s.sides;
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const rr = s.star ? (i%2===0 ? s.r : s.r*s.inner) : s.r;
    pts.push([s.cx + rr*Math.cos(ang), s.cy + rr*Math.sin(ang)]);
  }
  return pts;
}

function pathD(s){
  const p = s.pts;
  if(p.length < 2) return '';
  if(!s.smooth){
    let d = 'M ' + fmt(p[0].x) + ' ' + fmt(p[0].y);
    for(let i=1;i<p.length;i++) d += ' L ' + fmt(p[i].x) + ' ' + fmt(p[i].y);
    if(s.closed) d += ' Z';
    return d;
  }
  // Catmull-Rom → ベジェ変換（滑らかな曲線）
  const n = p.length;
  const get = i => s.closed ? p[(i+n)%n] : p[clamp(i,0,n-1)];
  let d = 'M ' + fmt(p[0].x) + ' ' + fmt(p[0].y);
  const last = s.closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p0=get(i-1), p1=get(i), p2=get(i+1), p3=get(i+2);
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += ' C ' + [c1x,c1y,c2x,c2y,p2.x,p2.y].map(fmt).join(' ');
  }
  if(s.closed) d += ' Z';
  return d;
}

/* ================= テキストの自動折り返し・文字間調整 ================= */
const measureCtx = document.createElement('canvas').getContext('2d');
/* 書体キー（レジストリ）ならCSSスタックへ、それ以外は実ファミリ名として扱う。
   旧データのfont（実ファミリ名や総称）もそのまま解決できる */
function fontFamilyAttr(f){
  f = f || 'sans-serif';
  const stack = (typeof FONTS!=='undefined' && FONTS[f]) ? FONTS[f].stack : null;
  if(stack) return stack;
  return /^(sans-serif|serif|monospace)$/.test(f) ? f : '"'+f+'", sans-serif';
}
let wordSeg = null;
const KINSOKU_HEAD = /^[、。，．！？!?・：；:;）」』〉》〕】｝%％‰°℃ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮーゝゞヽヾ々…‥,.)\]}]/;
const KINSOKU_TAIL = /[（「『〈《〔【｛([{]$/;
function segmentWords(text){
  // 単語（名詞等）の途中で改行しないよう、言語対応の単語分割を使う
  let units;
  try{
    if(!wordSeg && window.Intl && Intl.Segmenter) wordSeg = new Intl.Segmenter('ja', {granularity:'word'});
    units = wordSeg ? [...wordSeg.segment(text)].map(x=>x.segment) : null;
  }catch(err){ units = null; }
  if(!units) units = text.split(/(\s+)/).filter(t=>t!=='');
  // 禁則処理: 行頭に来てはならない記号は前の語へ、行末に残せない開き括弧は次の語へ結合
  const out = [];
  units.forEach(u=>{
    if(out.length && (KINSOKU_HEAD.test(u) || KINSOKU_TAIL.test(out[out.length-1]))) out[out.length-1] += u;
    else out.push(u);
  });
  return out;
}
/* ルビ記法（青空文庫式）: 漢字《かんじ》 は直前の漢字連続部に、｜対象《るび》 は｜以降に振る */
const RUBY_RE = /(?:[｜|])([^《》｜|\n]{1,50})《([^《》\n]{1,50})》|([々㐀-鿿豈-﫿々〆ヵヶ]+)《([^《》\n]{1,50})》/g;
function tokenizeRuby(para){
  const out = [];
  let last = 0, m;
  RUBY_RE.lastIndex = 0;
  while((m = RUBY_RE.exec(para))){
    if(m.index > last) out.push({t: para.slice(last, m.index)});
    out.push(m[1]!==undefined ? {t:m[1], r:m[2]} : {t:m[3], r:m[4]});
    last = RUBY_RE.lastIndex;
  }
  if(last < para.length) out.push({t: para.slice(last)});
  return out;
}
function layoutText(s){
  measureCtx.font = `${textWeight(s)} ${s.size}px ${fontFamilyAttr(s.font)}`;
  const baseLS = +s.ls || 0;   // 文字間（ユーザー指定、px）
  const w = t => measureCtx.measureText(t).width + baseLS*t.length;
  const out = [];
  const mkLine = (segs, last)=>{
    const text = segs.map(g=>g.t).join('');
    let ls = baseLS;
    // 行末揃え: 枠幅との差を文字間に均等配分（最大0.25em、不自然な広がりを防ぐ）
    if(s.boxW && s.justify!==false && !last && text.length>1){
      ls = baseLS + clamp((s.boxW - w(text))/text.length, 0, s.size*0.25);
    }
    const ruby = []; let pos = 0;
    segs.forEach(g=>{ if(g.r) ruby.push({start:pos, len:g.t.length, r:g.r}); pos += g.t.length; });
    return {text, ls: Math.round(ls*100)/100, ruby};
  };
  String(s.text).split('\n').forEach(para=>{
    const toks = [];
    tokenizeRuby(para).forEach(tk=>{
      if(tk.r) toks.push(tk);   // ルビ付き部分は折返しで分割しない
      else segmentWords(tk.t).forEach(u=> toks.push({t:u}));
    });
    if(!s.boxW || !para){ out.push(mkLine(toks, true)); return; }
    let cur = [];
    const curText = ()=> cur.map(g=>g.t).join('');
    toks.forEach(tk=>{
      if(cur.length && w(curText()+tk.t) > s.boxW){
        out.push(mkLine(cur, false));
        cur = [tk.r ? tk : {t: tk.t.replace(/^\s+/,'')}];
      }else cur.push(tk);
      // 1単語が枠より長い場合のみ、やむを得ず文字単位で分割（ルビ付きは分割しない）
      while(cur.length===1 && !cur[0].r && cur[0].t.length>1 && w(cur[0].t) > s.boxW){
        const u = cur[0].t;
        let k = u.length-1;
        while(k>1 && w(u.slice(0,k)) > s.boxW) k--;
        out.push(mkLine([{t:u.slice(0,k)}], false));
        cur = [{t: u.slice(k).replace(/^\s+/,'')}];
      }
    });
    out.push(mkLine(cur, true));
  });
  return out;
}
/* 行のtspan群を構築する共通処理（通常テキスト・枠内テキストで共用）。
   行位置は絶対y指定（ルビ用tspanを挟んでもdy連鎖が壊れないようにするため） */
function buildTextLines(t, spec, x, y0, lines){
  const NS = 'http://www.w3.org/2000/svg';
  const size = spec.size, lh = (spec.lineH || 1.25)*size;
  measureCtx.font = `${textWeight(spec)} ${size}px ${fontFamilyAttr(spec.font)}`;
  (lines || layoutText(spec)).forEach((ln,i)=>{
    const y = y0 + i*lh;
    const tp = document.createElementNS(NS,'tspan');
    tp.setAttribute('x',fmt(x)); tp.setAttribute('y',fmt(y));
    if(ln.ls) tp.setAttribute('letter-spacing', ln.ls);
    tp.textContent = ln.text || ' ';
    t.appendChild(tp);
    (ln.ruby||[]).forEach(rb=>{
      const pre = ln.text.slice(0, rb.start);
      const base = ln.text.slice(rb.start, rb.start+rb.len);
      const preW = measureCtx.measureText(pre).width + ln.ls*pre.length;
      const rubyY = y - size*0.85 - (+spec.rubyDy||0);
      // ルビ内のスペース（半角・全角）区切りで基底1文字ずつに割り当てる（モノルビ）
      const groups = rb.r.split(/[ 　]+/).filter(g=>g);
      const targets = [];
      if(groups.length > 1){
        const chars = [...base];
        chars.forEach((c,i)=>{ if(i < groups.length) targets.push({b:c, r:groups[i], pre:chars.slice(0,i).join('')}); });
        if(groups.length > chars.length) targets[targets.length-1].r += groups.slice(chars.length).join('');
      }else targets.push({b:base, r:rb.r, pre:''});
      targets.forEach(tg=>{
        const offW = measureCtx.measureText(tg.pre).width + ln.ls*tg.pre.length;
        const baseW = measureCtx.measureText(tg.b).width + ln.ls*Math.max(0, tg.b.length-1);
        const rt = document.createElementNS(NS,'tspan');
        rt.setAttribute('x', fmt(x + preW + offW + baseW/2));
        rt.setAttribute('y', fmt(rubyY));
        rt.setAttribute('font-size', fmt(size*0.5));
        rt.setAttribute('text-anchor','middle');
        if(spec.rubyLS) rt.setAttribute('letter-spacing', spec.rubyLS);
        rt.textContent = tg.r;
        t.appendChild(rt);
      });
    });
  });
}

/* ================= グラデーション ================= */
function gradientId(s){ return 'grad'+s.id; }
function gradientDefString(s){
  const g = s.fill, gid = gradientId(s);
  const stops = (g.stops||[]).map(st=>`<stop offset="${fmt(clamp(st.offset,0,1)*100)}%" stop-color="${esc(st.color)}"/>`).join('');
  if(g.type==='radial'){
    return `<radialGradient id="${gid}" cx="50%" cy="50%" r="70%">${stops}</radialGradient>`;
  }
  const ang = deg2rad(g.angle||0);
  const x1 = 50 - 50*Math.cos(ang), y1 = 50 - 50*Math.sin(ang);
  const x2 = 50 + 50*Math.cos(ang), y2 = 50 + 50*Math.sin(ang);
  return `<linearGradient id="${gid}" x1="${fmt(x1)}%" y1="${fmt(y1)}%" x2="${fmt(x2)}%" y2="${fmt(y2)}%">${stops}</linearGradient>`;
}
function markerDefString(s){
  const col = s.stroke==='none' ? '#000000' : s.stroke;
  return `<marker id="arw${s.id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="${esc(col)}"/></marker>`;
}
function dynamicDefStrings(){
  const out = [];
  state.shapes.forEach(s=>{
    if(s.fill && typeof s.fill==='object') out.push(gradientDefString(s));
    if((s.arrowS||s.arrowE) && (s.type==='line'||(s.type==='path'&&!s.closed))) out.push(markerDefString(s));
    if(isFrameShape(s) && s.text){
      // 均等割付の行は枠幅ぴったりまで伸びる。字形のインクは送り幅よりわずかに外へ出るため、
      // クリップをその分だけ広げないと行末の字が削れる
      const box = frameTextBox(s), ink = frameInkPad(s);
      out.push(`<clipPath id="clip${s.id}"><rect x="${fmt(box.x-ink)}" y="${fmt(box.y-ink)}" width="${fmt(Math.max(0,box.w+ink*2))}" height="${fmt(Math.max(0,box.h+ink*2))}"/></clipPath>`);
    }
  });
  return out;
}
function updateGradientDefs(){
  $('gradDefs').innerHTML = dynamicDefStrings().join('');
}

/* ================= 図形の枠内テキスト（矩形・楕円・多角形） ================= */
const FRAME_TEXT_PAD = 8;
function isFrameShape(s){ return s.type==='rect' || s.type==='ellipse' || s.type==='poly'; }
/* 枠内文字のレイアウト指定（描画・自動調整で同じ値を使う） */
function frameTextSpec(s, boxW){
  return {text:s.text, size:s.size||16, font:s.font||'sans-serif', bold:s.bold, weight:s.weight,
    boxW, justify:true, ls:s.ls, lineH:s.lineH, rubyLS:s.rubyLS, rubyDy:s.rubyDy};
}
/* 字形のインクが送り幅から外へ出る分の許容量 */
function frameInkPad(s){ return Math.ceil((s.size||16)*0.12); }
/* 1行目にルビがある分だけ、クリップで欠けないよう先頭行を下げる量 */
function frameRubyPad(s, lines){
  const size = s.size || 16;
  return (lines[0] && lines[0].ruby && lines[0].ruby.length) ? size*0.55 + Math.max(0, +s.rubyDy||0) : 0;
}
/* 枠内で文字を組める領域。矩形は外接矩形の内側だが、楕円・多角形は外接矩形の隅が
   図形の外へ出てしまうため、図形に内接する中央寄せの矩形を使う */
function frameInnerRadiusRatio(s){
  // 外接円半径に対する内接円半径の比。星形は内側の頂点までしか使えない
  const n = Math.max(3, s.sides||3);
  const base = Math.cos(Math.PI/n);
  return s.star ? Math.min(base, s.inner||0.5) : base;
}
function frameTextBox(s){
  const pad = FRAME_TEXT_PAD, b = geomBBox(s);
  if(s.type==='rect'){
    return {x:b.x+pad, y:b.y+pad, w:Math.max(10,b.w-pad*2), h:Math.max(6,b.h-pad*2)};
  }
  let w, h;
  if(s.type==='ellipse'){ w = s.rx*Math.SQRT2; h = s.ry*Math.SQRT2; }
  else {
    // 内接円に収まる、外接矩形と同じ縦横比の矩形
    const k = 2*s.r*frameInnerRadiusRatio(s)/Math.hypot(b.w, b.h);
    w = b.w*k; h = b.h*k;
  }
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  return {x:cx-w/2+pad, y:cy-h/2+pad, w:Math.max(10,w-pad*2), h:Math.max(6,h-pad*2)};
}
/* 文字を組む領域が needW×needH になるよう枠を広げる。外接矩形の左上は動かさない */
function fitFrameToTextBox(s, needW, needH){
  const pad = FRAME_TEXT_PAD, b = geomBBox(s);
  if(s.type==='rect'){ s.w = needW + pad*2; s.h = needH + pad*2; return; }
  if(s.type==='ellipse'){
    s.rx = (needW + pad*2)/Math.SQRT2;
    s.ry = (needH + pad*2)/Math.SQRT2;
    s.cx = b.x + s.rx; s.cy = b.y + s.ry;
    return;
  }
  if(s.type==='poly'){
    // 外接矩形も内接円も半径に比例するので、必要な倍率は一次式で解ける
    const uw = b.w/s.r, uh = b.h/s.r;
    const k = 2*frameInnerRadiusRatio(s)/Math.hypot(uw, uh);
    s.r = Math.max(4, Math.max((needW + pad*2)/(uw*k), (needH + pad*2)/(uh*k)));
    const nb = geomBBox(s);
    s.cx += b.x - nb.x; s.cy += b.y - nb.y;
  }
}
/* 枠内文字の全文が収まる大きさへ枠を合わせる。
   折返しは現在の枠幅で決め、そのうえで最長行の幅・総行数の高さちょうどに詰める。
   最長行は元の枠幅以下なので、詰めても行の折れ位置は変わらない */
function autoFitFrame(s){
  if(!isFrameShape(s) || s.fitText===false || !s.text) return false;
  const size = s.size || 16;
  const box = frameTextBox(s);
  const boxW = box.w;
  // 均等割付を切って測る（均等割付の文字間は枠幅ぴったりに広げるため、実際の字幅にならない）
  const spec = frameTextSpec(s, boxW);
  const lines = layoutText({...spec, justify:false});
  if(!lines.length) return false;
  measureCtx.font = `${textWeight(spec)} ${size}px ${fontFamilyAttr(spec.font)}`;
  const baseLS = +s.ls || 0;
  let maxW = 0;
  lines.forEach(ln=>{
    const t = ln.text || '';
    maxW = Math.max(maxW, measureCtx.measureText(t).width + baseLS*Math.max(0, t.length-1));
  });
  const lh = (s.lineH || 1.25)*size;
  const rubyPad = frameRubyPad(s, lines);
  // 先頭行のベースラインは pad+rubyPad+size*0.9、最終行はその (n-1)*lh 下。さらに下方の張り出し分を足す
  const needW = clamp(Math.ceil(maxW), 10, DOC_MAX_PX);
  const needH = clamp(Math.ceil(rubyPad + size*0.9 + (lines.length-1)*lh + size*0.35), 6, DOC_MAX_PX);
  if(Math.abs(needW-box.w) < 0.5 && Math.abs(needH-box.h) < 0.5) return false;
  fitFrameToTextBox(s, needW, needH);
  return true;
}
function frameTextEl(s){
  const NS = 'http://www.w3.org/2000/svg';
  const box = frameTextBox(s);
  const size = s.size || 16;
  const fake = frameTextSpec(s, box.w);
  const t = document.createElementNS(NS,'text');
  const lines = layoutText(fake);
  const rubyPad = frameRubyPad(s, lines);
  const x = box.x, y = box.y + size*0.9 + rubyPad;
  t.setAttribute('x',fmt(x)); t.setAttribute('y',fmt(y));
  t.setAttribute('font-size', size);
  t.setAttribute('font-family', fontFamilyAttr(fake.font));
  t.setAttribute('font-weight', String(textWeight(fake)));
  t.setAttribute('fill', s.textFill || '#111111');
  t.setAttribute('clip-path', `url(#clip${s.id})`);
  buildTextLines(t, fake, x, y, lines);
  return t;
}

function shapeEl(s, live){
  const NS = 'http://www.w3.org/2000/svg';
  let el;
  switch(s.type){
    case 'image':
      el = document.createElementNS(NS,'image');
      el.setAttribute('x',fmt(s.x)); el.setAttribute('y',fmt(s.y));
      el.setAttribute('width',fmt(Math.max(0,s.w))); el.setAttribute('height',fmt(Math.max(0,s.h)));
      el.setAttribute('preserveAspectRatio','none');
      el.setAttribute('href', s.src);
      el.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href', s.src);
      break;
    case 'rect':
      el = document.createElementNS(NS,'rect');
      el.setAttribute('x',fmt(s.x)); el.setAttribute('y',fmt(s.y));
      el.setAttribute('width',fmt(Math.max(0,s.w))); el.setAttribute('height',fmt(Math.max(0,s.h)));
      if(s.rx) el.setAttribute('rx',fmt(s.rx));
      break;
    case 'ellipse':
      el = document.createElementNS(NS,'ellipse');
      el.setAttribute('cx',fmt(s.cx)); el.setAttribute('cy',fmt(s.cy));
      el.setAttribute('rx',fmt(Math.max(0,s.rx))); el.setAttribute('ry',fmt(Math.max(0,s.ry)));
      break;
    case 'line':
      el = document.createElementNS(NS,'line');
      el.setAttribute('x1',fmt(s.x1)); el.setAttribute('y1',fmt(s.y1));
      el.setAttribute('x2',fmt(s.x2)); el.setAttribute('y2',fmt(s.y2));
      break;
    case 'poly':
      el = document.createElementNS(NS,'polygon');
      el.setAttribute('points', polyPoints(s).map(p=>fmt(p[0])+','+fmt(p[1])).join(' '));
      break;
    case 'path':
      el = document.createElementNS(NS,'path');
      el.setAttribute('d', pathD(s));
      break;
    case 'text':{
      el = document.createElementNS(NS,'text');
      el.setAttribute('x',fmt(s.x)); el.setAttribute('y',fmt(s.y));
      el.setAttribute('font-size',s.size);
      el.setAttribute('font-family',fontFamilyAttr(s.font));
      el.setAttribute('font-weight', String(textWeight(s)));
      buildTextLines(el, s, s.x, s.y);
      break;
    }
  }
  if(s.type==='line' || (s.type==='path' && !s.closed && s.fill==='none')){
    el.setAttribute('fill','none');
  }else if(s.type!=='line' && s.type!=='image'){
    el.setAttribute('fill', typeof s.fill==='object' ? `url(#${gradientId(s)})` : s.fill);
    if(s.fill!=='none' && s.fillAlpha<1) el.setAttribute('fill-opacity', s.fillAlpha);
  }
  if(s.stroke!=='none' && s.strokeWidth>0 && s.type!=='image'){
    el.setAttribute('stroke', s.stroke);
    el.setAttribute('stroke-width', s.strokeWidth);
    el.setAttribute('stroke-linecap','round');
    el.setAttribute('stroke-linejoin','round');
    if(s.strokeAlpha<1) el.setAttribute('stroke-opacity', s.strokeAlpha);
    if(s.dash==='dash') el.setAttribute('stroke-dasharray', `${s.strokeWidth*3} ${s.strokeWidth*2}`);
    else if(s.dash==='dot') el.setAttribute('stroke-dasharray', `0.1 ${s.strokeWidth*2}`);
    if(s.type==='line' || (s.type==='path' && !s.closed)){
      if(s.arrowS) el.setAttribute('marker-start', `url(#arw${s.id})`);
      if(s.arrowE) el.setAttribute('marker-end', `url(#arw${s.id})`);
    }
  }
  const hasFrameText = isFrameShape(s) && s.text;
  let textEl = null, result = el;
  if(hasFrameText){
    textEl = frameTextEl(s);
    result = document.createElementNS(NS,'g');
    result.appendChild(el);
    result.appendChild(textEl);
  }
  if(s.opacity < 1) result.setAttribute('opacity', s.opacity);
  if(s.rotation){
    const b = geomBBox(s);
    result.setAttribute('transform', `rotate(${fmt(s.rotation)} ${fmt(b.x+b.w/2)} ${fmt(b.y+b.h/2)})`);
  }
  if(live){
    result.setAttribute('id','el-'+s.id);
    result.dataset.id = s.id;
    if(hasFrameText){ el.dataset.id = s.id; textEl.dataset.id = s.id; }
    if(shapeLocked(s)) result.setAttribute('pointer-events','none');
  }
  return result;
}

/* ================= バウンディングボックス ================= */
function geomBBox(s){
  switch(s.type){
    case 'rect': return {x:s.x, y:s.y, w:s.w, h:s.h};
    case 'image': return {x:s.x, y:s.y, w:s.w, h:s.h};
    case 'ellipse': return {x:s.cx-s.rx, y:s.cy-s.ry, w:s.rx*2, h:s.ry*2};
    case 'line':{
      const x=Math.min(s.x1,s.x2), y=Math.min(s.y1,s.y2);
      return {x, y, w:Math.abs(s.x2-s.x1), h:Math.abs(s.y2-s.y1)};
    }
    case 'poly':{
      const pts = polyPoints(s);
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      const x=Math.min(...xs), y=Math.min(...ys);
      return {x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y};
    }
    case 'path':{
      const xs = s.pts.map(p=>p.x), ys = s.pts.map(p=>p.y);
      const x=Math.min(...xs), y=Math.min(...ys);
      return {x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y};
    }
    case 'text':{
      const el = $('el-'+s.id);
      if(el){ const b = el.getBBox(); return {x:b.x, y:b.y, w:b.width, h:b.height}; }
      const lh = (s.lineH||1.25)*s.size;
      if(s.boxW){
        const n = layoutText(s).length;
        return {x:s.x, y:s.y-s.size, w:s.boxW, h:lh*Math.max(0,n-1)+s.size*1.2};
      }
      return {x:s.x, y:s.y-s.size, w:s.size*String(s.text).length*0.6, h:s.size*1.2};
    }
  }
}
function renderBBox(s){
  const b = geomBBox(s);
  if(!s.rotation) return b;
  const cx=b.x+b.w/2, cy=b.y+b.h/2, a=deg2rad(s.rotation);
  const cos=Math.cos(a), sin=Math.sin(a);
  const corners = [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(([px,py])=>{
    const dx=px-cx, dy=py-cy;
    return [cx+dx*cos-dy*sin, cy+dx*sin+dy*cos];
  });
  const xs=corners.map(c=>c[0]), ys=corners.map(c=>c[1]);
  const x=Math.min(...xs), y=Math.min(...ys);
  return {x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y};
}
function selShapes(){ return state.shapes.filter(s=>state.sel.has(s.id)); }
function selBBox(){
  const ss = selShapes();
  if(!ss.length) return null;
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  ss.forEach(s=>{
    const b = renderBBox(s);
    x1=Math.min(x1,b.x); y1=Math.min(y1,b.y);
    x2=Math.max(x2,b.x+b.w); y2=Math.max(y2,b.y+b.h);
  });
  return {x:x1, y:y1, w:x2-x1, h:y2-y1};
}

/* ================= 履歴 ================= */
function snapshot(){ return JSON.stringify({shapes:state.shapes, layers:state.layers, activeLayer:state.activeLayer}); }
function restoreSnapshot(str){
  const d = JSON.parse(str);
  state.shapes = d.shapes;
  if(Array.isArray(d.layers)) state.layers = d.layers;
  if(d.activeLayer) state.activeLayer = d.activeLayer;
}
function pushHistory(){
  undoStack.push(snapshot());
  if(undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  restoreSnapshot(undoStack.pop());
  pruneSel(); render();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  restoreSnapshot(redoStack.pop());
  pruneSel(); render();
}
function pruneSel(){
  const ids = new Set(state.shapes.map(s=>s.id));
  [...state.sel].forEach(id=>{ if(!ids.has(id)) state.sel.delete(id); });
}
function cancelActiveDrag(){
  // ピンチ開始やポインタ喪失時に進行中の編集を巻き戻す
  if(!drag) return;
  if(['create','move','resize','rotate','node','pencil'].includes(drag.mode) && undoStack.length){
    restoreSnapshot(undoStack.pop());
    pruneSel();
  }
  if(drag.mode==='pan') stage.classList.remove('panning');
  drag = null;
  render();
}

/* ================= 描画 ================= */
function updateWorld(){
  world.setAttribute('transform', `translate(${state.panX} ${state.panY}) scale(${state.zoom})`);
  $('zoomLabel').textContent = Math.round(state.zoom*100)+'%';
  renderChrome();
}
/* --- 定規とガイド（スクリーン座標で描画） --- */
function renderChrome(){
  const gl = $('guideLayer'), rl = $('rulerLayer');
  gl.innerHTML = ''; rl.innerHTML = '';
  if(!state.ruler) return;
  const NS = 'http://www.w3.org/2000/svg';
  const rc = stage.getBoundingClientRect();
  const W = rc.width, H = rc.height, z = state.zoom;
  const mk = (tag, attrs, parent)=>{
    const el = document.createElementNS(NS, tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    parent.appendChild(el);
    return el;
  };
  // ガイド線
  state.guides.v.forEach((g,i)=>{
    const x = state.panX + g*z;
    mk('line',{x1:x,y1:0,x2:x,y2:H,stroke:'#3aa0ff','stroke-width':1,'pointer-events':'none'},gl);
    const hit = mk('line',{x1:x,y1:0,x2:x,y2:H,stroke:'transparent','stroke-width':7},gl);
    hit.dataset.guide = 'v:'+i; hit.style.cursor = 'ew-resize';
  });
  state.guides.h.forEach((g,i)=>{
    const y = state.panY + g*z;
    mk('line',{x1:0,y1:y,x2:W,y2:y,stroke:'#3aa0ff','stroke-width':1,'pointer-events':'none'},gl);
    const hit = mk('line',{x1:0,y1:y,x2:W,y2:y,stroke:'transparent','stroke-width':7},gl);
    hit.dataset.guide = 'h:'+i; hit.style.cursor = 'ns-resize';
  });
  // 定規の背景
  mk('rect',{x:0,y:0,width:W,height:20,fill:'#1f2127'},rl);
  mk('rect',{x:0,y:0,width:20,height:H,fill:'#1f2127'},rl);
  // 目盛り間隔（画面上でおよそ60pxになる切りのよい値）
  const target = 60/z;
  const pow = Math.pow(10, Math.floor(Math.log10(target)));
  const m = target/pow;
  const step = (m<1.5 ? 1 : m<3.5 ? 2 : m<7.5 ? 5 : 10)*pow;
  let d = '';
  const x0 = Math.floor(((20-state.panX)/z)/step)*step;
  for(let x=x0; state.panX+x*z<=W; x+=step){
    const sx = state.panX + x*z;
    if(sx < 20) continue;
    d += `M ${fmt(sx)} 13 V 20 `;
    const t = mk('text',{x:sx+3,y:10,'font-size':9,fill:'#8b909b'},rl);
    t.textContent = fmt(x);
  }
  const y0 = Math.floor(((20-state.panY)/z)/step)*step;
  for(let y=y0; state.panY+y*z<=H; y+=step){
    const sy = state.panY + y*z;
    if(sy < 20) continue;
    d += `M 13 ${fmt(sy)} H 20 `;
    const t = mk('text',{x:11,y:sy-3,'font-size':9,fill:'#8b909b',transform:`rotate(-90 11 ${fmt(sy-3)})`},rl);
    t.textContent = fmt(y);
  }
  mk('path',{d, stroke:'#5a5f6b','stroke-width':1, fill:'none'},rl);
  mk('rect',{x:0,y:0,width:20,height:20,fill:'#25272e'},rl);
  mk('line',{x1:0,y1:20,x2:W,y2:20,stroke:'#2e313a','stroke-width':1},rl);
  mk('line',{x1:20,y1:0,x2:20,y2:H,stroke:'#2e313a','stroke-width':1},rl);
}
function render(skipProps){
  const d = state.doc;
  const ab = $('artboard');
  ab.setAttribute('width',d.w); ab.setAttribute('height',d.h); ab.setAttribute('fill',d.bg==='none'?'#ffffff':d.bg);
  const gr = $('gridRect');
  gr.setAttribute('width',d.w); gr.setAttribute('height',d.h);
  gr.style.display = state.grid ? '' : 'none';
  $('gridpat').setAttribute('width',state.gridSize);
  $('gridpat').setAttribute('height',state.gridSize);
  $('gridpath').setAttribute('d',`M ${state.gridSize} 0 L 0 0 0 ${state.gridSize}`);

  ensureLayers();
  normalizeOrder();
  updateGradientDefs();
  shapesLayer.innerHTML = '';
  state.shapes.forEach(s=>{ if(shapeVisible(s)) shapesLayer.appendChild(shapeEl(s,true)); });

  renderHandles();
  renderLayers();
  if(!skipProps) renderProps();
  updateWorld();
  autosave();
}

/* --- 選択ハンドル --- */
function renderNodeHandles(){
  const ss = selShapes();
  if(ss.length !== 1) return;
  const s = ss[0];
  let pts;
  if(s.type==='path') pts = s.pts;
  else if(s.type==='line') pts = [{x:s.x1,y:s.y1},{x:s.x2,y:s.y2}];
  else return;
  const NS = 'http://www.w3.org/2000/svg', z = state.zoom;
  pts.forEach((pt,i)=>{
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); c.setAttribute('r',4.5/z);
    c.setAttribute('fill','#fff'); c.setAttribute('stroke','#d24a35'); c.setAttribute('stroke-width',1.2/z);
    c.dataset.node = i; c.style.cursor = 'move';
    handleLayer.appendChild(c);
  });
}
function renderHandles(){
  handleLayer.innerHTML = '';
  overlayRenderPen();
  if(state.tool==='node'){ renderNodeHandles(); return; }
  const b = selBBox();
  if(!b || drag && drag.mode==='marquee') { if(!b) return; }
  const NS='http://www.w3.org/2000/svg';
  const z = state.zoom;
  const box = document.createElementNS(NS,'rect');
  box.setAttribute('x',b.x); box.setAttribute('y',b.y);
  box.setAttribute('width',b.w); box.setAttribute('height',b.h);
  box.setAttribute('fill','none'); box.setAttribute('stroke','#d24a35');
  box.setAttribute('stroke-width',1/z); box.setAttribute('stroke-dasharray',(4/z)+' '+(3/z));
  box.setAttribute('pointer-events','none');
  handleLayer.appendChild(box);

  const hs = 7/z;
  const handles = [
    ['nw',b.x,b.y],['n',b.x+b.w/2,b.y],['ne',b.x+b.w,b.y],
    ['e',b.x+b.w,b.y+b.h/2],['se',b.x+b.w,b.y+b.h],
    ['s',b.x+b.w/2,b.y+b.h],['sw',b.x,b.y+b.h],['w',b.x,b.y+b.h/2],
  ];
  const cursors = {nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize'};
  handles.forEach(([h,x,y])=>{
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x',x-hs/2); r.setAttribute('y',y-hs/2);
    r.setAttribute('width',hs); r.setAttribute('height',hs);
    r.setAttribute('fill','#fff'); r.setAttribute('stroke','#d24a35'); r.setAttribute('stroke-width',1/z);
    r.dataset.handle = h; r.style.cursor = cursors[h];
    handleLayer.appendChild(r);
  });
  // 回転ハンドル（単一選択時のみ）
  if(state.sel.size===1){
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1',b.x+b.w/2); line.setAttribute('y1',b.y);
    line.setAttribute('x2',b.x+b.w/2); line.setAttribute('y2',b.y-20/z);
    line.setAttribute('stroke','#d24a35'); line.setAttribute('stroke-width',1/z);
    line.setAttribute('pointer-events','none');
    handleLayer.appendChild(line);
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',b.x+b.w/2); c.setAttribute('cy',b.y-20/z); c.setAttribute('r',5/z);
    c.setAttribute('fill','#fff'); c.setAttribute('stroke','#d24a35'); c.setAttribute('stroke-width',1/z);
    c.dataset.rotate = '1'; c.style.cursor = 'crosshair';
    handleLayer.appendChild(c);
  }
}

function overlayRenderPen(){
  overlayLayer.innerHTML = '';
  const NS='http://www.w3.org/2000/svg', z=state.zoom;
  if(drag && drag.mode==='marquee'){
    const r = document.createElementNS(NS,'rect');
    const x=Math.min(drag.start.x,drag.cur.x), y=Math.min(drag.start.y,drag.cur.y);
    r.setAttribute('x',x); r.setAttribute('y',y);
    r.setAttribute('width',Math.abs(drag.cur.x-drag.start.x));
    r.setAttribute('height',Math.abs(drag.cur.y-drag.start.y));
    r.setAttribute('fill','rgba(210,74,53,.08)'); r.setAttribute('stroke','#d24a35');
    r.setAttribute('stroke-width',1/z); r.setAttribute('stroke-dasharray',(3/z)+' '+(3/z));
    overlayLayer.appendChild(r);
  }
  if(pen && pen.pts.length){
    const pl = document.createElementNS(NS,'polyline');
    const pts = pen.cur ? [...pen.pts, pen.cur] : pen.pts;
    pl.setAttribute('points', pts.map(p=>p.x+','+p.y).join(' '));
    pl.setAttribute('fill','none'); pl.setAttribute('stroke','#d24a35'); pl.setAttribute('stroke-width',1.5/z);
    overlayLayer.appendChild(pl);
    pen.pts.forEach((p,i)=>{
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',(i===0?5:3.5)/z);
      c.setAttribute('fill', i===0?'#d24a35':'#fff');
      c.setAttribute('stroke','#d24a35'); c.setAttribute('stroke-width',1/z);
      overlayLayer.appendChild(c);
    });
  }
}

  ['poly','多角形 (P)', '<path d="M10 3.5 L16 8 L13.7 15 L6.3 15 L4 8 Z"/>'],
  ['star','星形 (S)', '<path d="M10 3 L11.8 7.6 L16.5 7.9 L12.9 11 L14 15.7 L10 13.1 L6 15.7 L7.1 11 L3.5 7.9 L8.2 7.6 Z"/>'],
  ['pen','ペン (N)', '<path d="M4 16 L13 4 L16 6.5 L7 16 Z"/><circle cx="14.5" cy="5.2" r="1.4"/>'],

  ['hand','手のひら (H)', '<path d="M7 10 V5.5 a1.2 1.2 0 0 1 2.4 0 V9 M9.4 9 V4.5 a1.2 1.2 0 0 1 2.4 0 V9 M11.8 9 V5.5 a1.2 1.2 0 0 1 2.4 0 V11 c0 3-1.5 5.5-4.5 5.5 c-2.5 0-3.6-1.4-4.8-3.8 L6.4 9.5 a1.1 1.1 0 0 1 2 -.4 L7 10"/>'],
];
const HINTS = {
  select:'クリックで選択／Shift+クリックで追加選択／ドラッグで移動・範囲選択',
  rect:'ドラッグで長方形を描画（Shiftで正方形）', ellipse:'ドラッグで楕円を描画（Shiftで正円）',
  line:'ドラッグで直線を描画（Shiftで45°刻み）', poly:'ドラッグで多角形を描画（辺数はプロパティで変更）',
  star:'ドラッグで星形を描画', pen:'クリックで点を追加／始点クリックで閉じる／Enterで確定／Escで取消',
  pencil:'ドラッグでフリーハンド描画', text:'クリックした位置に文字を配置（ダブルクリックで再編集／プロパティの折返幅で単語を切らない自動改行）',
  hand:'ドラッグで画面を移動（Spaceキーでも一時切替）',
  node:'パス・直線を選択して点をドラッグ／選択中のパスの線上クリックで点追加／点をダブルクリックまたはAlt+クリックで削除',
  picker:'図形をクリックしてスタイルを取得（他の図形を選択中ならそのスタイルを適用）',
};
function buildToolbar(){
  const tb = $('toolbar');
  TOOLS.forEach(([id,label,svg])=>{
    const b = document.createElement('button');
    b.className = 'tbtn'; b.title = label; b.dataset.tool = id;
    b.innerHTML = `<svg viewBox="0 0 20 20">${svg}</svg>`;
    b.onclick = ()=> setTool(id);
    tb.appendChild(b);
  });
}
/* 作図直後は選択ツールへ戻す。ツールが作図のままだと、置いた図形をドラッグしても
   移動ではなく次の図形の作成になり「動かせない」状態になるため。
   「連続作成」がオンのときは切り替えない */
function afterCreate(){
  if(state.keepTool) return;
  if(state.tool !== 'select') setTool('select');
}
function setTool(t){
  if(pen) finishPen(false);
  state.tool = t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active', b.dataset.tool===t));
  stage.setAttribute('class', 'tool-'+t);
  $('hint').textContent = HINTS[t] || '';
}

/* ================= ポインタ操作 ================= */
/* ポインタ位置の図形ID。<text>内の<tspan>やグループの子など、data-idを持たない
   子要素が当たることがあるため、最も近い祖先まで遡って引く */
function targetShapeId(e){
  const el = e.target;
  if(!el) return null;
  if(el.dataset && el.dataset.id) return el.dataset.id;
  const hit = el.closest ? el.closest('[data-id]') : null;
  return hit ? hit.dataset.id : null;
}
stage.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(touches.size===2){
      // 2本指: 進行中の操作を取り消してピンチズーム／パンへ移行
      cancelActiveDrag();
      const pts = [...touches.values()];
      pinch = {ids: [...touches.keys()],
        d0: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1,
        c0: {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2},
        z0: state.zoom, px0: state.panX, py0: state.panY};
      capture(e);
      return;
    }
    if(touches.size > 2) return;
    // ダブルタップ → ダブルクリック相当（テキスト再編集・ノード削除・ペン確定）
    const now = Date.now();
    if(lastTap && now-lastTap.t < 350 && Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 24){
      lastTap = null;
      handleStageDbl(e);
      return;
    }
    lastTap = {t:now, x:e.clientX, y:e.clientY};
  }
  if(e.button===1 || spaceDown || state.tool==='hand'){
    drag = {mode:'pan', sx:e.clientX, sy:e.clientY, px:state.panX, py:state.panY};
    stage.classList.add('panning');
    capture(e);
    return;
  }
  if(e.button!==0) return;
  const p = toWorld(e);
  const t = state.tool;

  // ガイドのドラッグ／定規からの新規ガイド作成
  if(state.ruler){
    if(e.target.dataset && e.target.dataset.guide){
      const [axis, idx] = e.target.dataset.guide.split(':');
      drag = {mode:'guide', axis, i:+idx};
      capture(e);
      return;
    }
    const rc = stage.getBoundingClientRect();
    const sx = e.clientX - rc.left, sy = e.clientY - rc.top;
    if(sx < 20 && sy >= 20){
      state.guides.v.push((sx - state.panX)/state.zoom);
      drag = {mode:'guide', axis:'v', i:state.guides.v.length-1};
      capture(e); renderChrome(); return;
    }
    if(sy < 20 && sx >= 20){
      state.guides.h.push((sy - state.panY)/state.zoom);
      drag = {mode:'guide', axis:'h', i:state.guides.h.length-1};
      capture(e); renderChrome(); return;
    }
  }

  if(t==='node'){
    if(e.target.dataset && e.target.dataset.node !== undefined){
      const s = selShapes()[0];
      if(!s) return;
      if(e.altKey && s.type==='path' && s.pts.length > 2){
        pushHistory();
        s.pts.splice(+e.target.dataset.node, 1);
        render();
        return;
      }
      pushHistory();
      drag = {mode:'node', s, i:+e.target.dataset.node, moved:false};
      capture(e);
      return;
    }
    const idAttr = targetShapeId(e);
    if(idAttr){
      const s = state.shapes.find(x=>x.id===+idAttr);
      if(s && state.sel.has(s.id) && s.type==='path'){
        pushHistory();
        const i = nearestSegment(s.pts, p, s.closed);
        s.pts.splice(i+1, 0, {x:p.x, y:p.y});
        drag = {mode:'node', s, i:i+1};
        render();
        capture(e);
      }else if(s && (s.type==='path' || s.type==='line')){
        state.sel = new Set([s.id]);
        render();
      }
      return;
    }
    state.sel.clear(); render();
    return;
  }

  if(t==='picker'){
    const idAttr = targetShapeId(e);
    if(idAttr){
      const src = state.shapes.find(x=>x.id===+idAttr);
      if(src) applyStyleFrom(src);
    }
    return;
  }

  if(t==='select'){
    const hEl = e.target.closest ? e.target : null;
    if(e.target.dataset && e.target.dataset.handle){
      pushHistory();
      drag = {mode:'resize', handle:e.target.dataset.handle, ob:selBBox(),
              orig:JSON.stringify(selShapes())};
    }else if(e.target.dataset && e.target.dataset.rotate){
      pushHistory();
      const s = selShapes()[0], b = renderBBox(s);
      const c = {x:b.x+b.w/2, y:b.y+b.h/2};
      drag = {mode:'rotate', c, startAng:Math.atan2(p.y-c.y,p.x-c.x), origRot:s.rotation||0, s};
    }else{
      const idAttr = targetShapeId(e);
      if(idAttr){
        const id = +idAttr;
        if(e.shiftKey){
          const s0 = state.shapes.find(x=>x.id===id);
          const members = s0 && s0.groupId ? state.shapes.filter(x=>x.groupId===s0.groupId).map(x=>x.id) : [id];
          const has = state.sel.has(id);
          members.forEach(m=> has ? state.sel.delete(m) : state.sel.add(m));
        }else if(!state.sel.has(id)){
          state.sel = new Set([id]);
          expandSelToGroups();
        }
        pushHistory();
        drag = {mode:'move', start:p, orig:JSON.stringify(selShapes()), moved:false, ob0:selBBox()};
        syncStyleFromSel();
        render();
      }else{
        if(!e.shiftKey) state.sel.clear();
        drag = {mode:'marquee', start:p, cur:p, keep:e.shiftKey ? new Set(state.sel) : new Set()};
        render();
      }
    }
    capture(e);
    return;
  }

  if(t==='rect'||t==='ellipse'||t==='line'||t==='poly'||t==='star'){
    pushHistory();
    const x = snapX(p.x), y = snapY(p.y);
    let s;
    if(t==='rect') s = newShape('rect',{x,y,w:0,h:0,rx:0});
    if(t==='ellipse') s = newShape('ellipse',{cx:x,cy:y,rx:0,ry:0});
    if(t==='line') s = newShape('line',{x1:x,y1:y,x2:x,y2:y});
    if(t==='poly') s = newShape('poly',{cx:x,cy:y,r:0,sides:6,star:false,inner:0.5});
    if(t==='star') s = newShape('poly',{cx:x,cy:y,r:0,sides:5,star:true,inner:0.45});
    state.shapes.push(s);
    state.sel = new Set([s.id]);
    drag = {mode:'create', s, start:{x,y}};
    render();
    capture(e);
    return;
  }

  if(t==='pencil'){
    pushHistory();
    const s = newShape('path',{pts:[{x:p.x,y:p.y}], closed:false, smooth:true, fill:'none'});
    state.shapes.push(s);
    state.sel = new Set([s.id]);
    drag = {mode:'pencil', s, last:p};
    render();
    capture(e);
    return;
  }

  if(t==='pen'){
    const pt = {x:snapX(p.x), y:snapY(p.y)};
    if(!pen){ pen = {pts:[pt], cur:null}; }
    else{
      if(pen.pts.length>=3 && dist(pt,pen.pts[0]) < 10/state.zoom){ finishPen(true); render(); return; }
      pen.pts.push(pt);
    }
    renderHandles();
    return;
  }

  if(t==='text'){
    pushHistory();
    const s = newShape('text',{x:snapX(p.x), y:snapY(p.y), text:'テキスト', size:32, font:'sans-serif', bold:false, stroke:'none', fill:'#222222'});
    state.shapes.push(s);
    state.sel = new Set([s.id]);
    afterCreate();
    render();
    openTextEditor(s);
    return;
  }
});

window.addEventListener('pointermove', e=>{
  if(pinch){
    if(touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const a = touches.get(pinch.ids[0]), b = touches.get(pinch.ids[1]);
    if(a && b){
      const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      const c = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      const r = stage.getBoundingClientRect();
      const nz = clamp(pinch.z0 * d/pinch.d0, 0.05, 16);
      // ピンチ開始時に2指の中心にあった点が、常に現在の中心に来るよう追従
      const wx = (pinch.c0.x - r.left - pinch.px0)/pinch.z0;
      const wy = (pinch.c0.y - r.top - pinch.py0)/pinch.z0;
      state.zoom = nz;
      state.panX = (c.x - r.left) - wx*nz;
      state.panY = (c.y - r.top) - wy*nz;
      updateWorld();
    }
    return;
  }
  const p = toWorld(e);
  $('coords').textContent = `x: ${fmt(p.x)}, y: ${fmt(p.y)}`;
  if(pen){ pen.cur = {x:snapX(p.x), y:snapY(p.y)}; overlayRenderPen(); }
  if(!drag) return;

  if(drag.mode==='pan'){
    state.panX = drag.px + (e.clientX - drag.sx);
    state.panY = drag.py + (e.clientY - drag.sy);
    updateWorld();
    return;
  }
  if(drag.mode==='marquee'){
    drag.cur = p;
    const x1=Math.min(drag.start.x,p.x), y1=Math.min(drag.start.y,p.y);
    const x2=Math.max(drag.start.x,p.x), y2=Math.max(drag.start.y,p.y);
    state.sel = new Set(drag.keep);
    state.shapes.forEach(s=>{
      if(!shapeVisible(s) || shapeLocked(s)) return;
      const b = renderBBox(s);
      if(b.x < x2 && b.x+b.w > x1 && b.y < y2 && b.y+b.h > y1) state.sel.add(s.id);
    });
    expandSelToGroups();
    render();
    return;
  }
  if(drag.mode==='guide'){
    const rc = stage.getBoundingClientRect();
    if(drag.axis==='v') state.guides.v[drag.i] = (e.clientX - rc.left - state.panX)/state.zoom;
    else state.guides.h[drag.i] = (e.clientY - rc.top - state.panY)/state.zoom;
    renderChrome();
    return;
  }
  if(drag.mode==='node'){
    const s = drag.s;
    const nx = snapX(p.x), ny = snapY(p.y);
    drag.moved = true;
    if(s.type==='line'){ if(drag.i===0){ s.x1=nx; s.y1=ny; } else { s.x2=nx; s.y2=ny; } }
    else if(s.pts && s.pts[drag.i]) s.pts[drag.i] = {x:nx, y:ny};
    render();
    return;
  }
  if(drag.mode==='move'){
    let dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if(state.snap){ dx = Math.round(dx/state.gridSize)*state.gridSize; dy = Math.round(dy/state.gridSize)*state.gridSize; }
    if(state.ruler && drag.ob0 && (state.guides.v.length || state.guides.h.length)){
      const thr = 6/state.zoom, b = drag.ob0;
      let ax = Infinity, ay = Infinity;
      [b.x+dx, b.x+b.w/2+dx, b.x+b.w+dx].forEach(edge=>{
        state.guides.v.forEach(g=>{ const d = g-edge; if(Math.abs(d)<thr && Math.abs(d)<Math.abs(ax)) ax = d; });
      });
      [b.y+dy, b.y+b.h/2+dy, b.y+b.h+dy].forEach(edge=>{
        state.guides.h.forEach(g=>{ const d = g-edge; if(Math.abs(d)<thr && Math.abs(d)<Math.abs(ay)) ay = d; });
      });
      if(isFinite(ax)) dx += ax;
      if(isFinite(ay)) dy += ay;
    }
    if(Math.abs(dx)>0.5||Math.abs(dy)>0.5) drag.moved = true;
    const orig = JSON.parse(drag.orig);
    selShapes().forEach((s,i)=> translateShape(s, orig[i], dx, dy));
    render();
    return;
  }
  if(drag.mode==='create'){
    const s = drag.s, st = drag.start;
    let x = snapX(p.x), y = snapY(p.y);
    if(s.type==='rect'){
      let w = x-st.x, h = y-st.y;
      if(e.shiftKey){ const m=Math.max(Math.abs(w),Math.abs(h)); w=Math.sign(w||1)*m; h=Math.sign(h||1)*m; }
      s.x = Math.min(st.x, st.x+w); s.y = Math.min(st.y, st.y+h);
      s.w = Math.abs(w); s.h = Math.abs(h);
    }else if(s.type==='ellipse'){
      let rx = Math.abs(x-st.x)/2, ry = Math.abs(y-st.y)/2;
      if(e.shiftKey){ rx = ry = Math.max(rx,ry); }
      s.cx = st.x + (x>=st.x?rx:-rx); s.cy = st.y + (y>=st.y?ry:-ry);
      s.rx = rx; s.ry = ry;
    }else if(s.type==='line'){
      if(e.shiftKey){
        const ang = Math.atan2(y-st.y, x-st.x);
        const snap = Math.round(ang/(Math.PI/4))*(Math.PI/4);
        const d = Math.hypot(x-st.x, y-st.y);
        x = st.x + d*Math.cos(snap); y = st.y + d*Math.sin(snap);
      }
      s.x2 = x; s.y2 = y;
    }else if(s.type==='poly'){
      s.r = Math.hypot(x-st.x, y-st.y);
    }
    render();
    return;
  }
  if(drag.mode==='pencil'){
    if(dist(p, drag.last) > 2/state.zoom){
      drag.s.pts.push({x:p.x, y:p.y});
      drag.last = p;
      const el = $('el-'+drag.s.id);
      if(el) el.setAttribute('d', pathD(drag.s));
    }
    return;
  }
  if(drag.mode==='resize'){
    const ob = drag.ob;
    let nb = {x:ob.x, y:ob.y, w:ob.w, h:ob.h};
    const h = drag.handle;
    if(h.includes('e')) nb.w = Math.max(1, snapX(p.x) - ob.x);
    if(h.includes('s')) nb.h = Math.max(1, snapY(p.y) - ob.y);
    if(h.includes('w')){ const nx = Math.min(snapX(p.x), ob.x+ob.w-1); nb.w = ob.x+ob.w-nx; nb.x = nx; }
    if(h.includes('n')){ const ny = Math.min(snapY(p.y), ob.y+ob.h-1); nb.h = ob.y+ob.h-ny; nb.y = ny; }
    if(e.shiftKey && h.length===2){
      const k = Math.max(nb.w/ob.w, nb.h/ob.h);
      const nw = ob.w*k, nh = ob.h*k;
      if(h.includes('w')) nb.x = ob.x+ob.w-nw;
      if(h.includes('n')) nb.y = ob.y+ob.h-nh;
      nb.w = nw; nb.h = nh;
    }
    const orig = JSON.parse(drag.orig);
    selShapes().forEach((s,i)=> bboxTransform(s, orig[i], ob, nb));
    render();
    return;
  }
  if(drag.mode==='rotate'){
    const ang = Math.atan2(p.y-drag.c.y, p.x-drag.c.x);
    let r = drag.origRot + (ang - drag.startAng)*180/Math.PI;
    if(e.shiftKey) r = Math.round(r/15)*15;
    r = ((r % 360) + 360) % 360;
    drag.s.rotation = Math.round(r*10)/10;
    render();
  }
});

window.addEventListener('pointerup', e=>{
  if(e.pointerType==='touch'){
    touches.delete(e.pointerId);
    if(pinch && pinch.ids.includes(e.pointerId)) pinch = null;
  }
  if(!drag) return;
  if(drag.mode==='pan') stage.classList.remove('panning');
  if(drag.mode==='node' && !drag.moved){
    // 動かしていないノードクリック: 履歴を破棄し、DOMを保持してdblclick（削除）を成立させる
    undoStack.pop();
    drag = null;
    return;
  }
  if(drag.mode==='guide'){
    const rc = stage.getBoundingClientRect();
    const sx = e.clientX - rc.left, sy = e.clientY - rc.top;
    if(drag.axis==='v' ? sx < 20 : sy < 20){
      (drag.axis==='v' ? state.guides.v : state.guides.h).splice(drag.i, 1);
    }
    renderChrome();
    autosave();
  }
  if(drag.mode==='create'){
    const s = drag.s, b = geomBBox(s);
    if(b.w < 2 && b.h < 2){
      // クリックのみ→既定サイズで配置
      if(s.type==='rect'){ s.w=120; s.h=90; }
      if(s.type==='ellipse'){ s.rx=60; s.ry=45; }
      if(s.type==='line'){ s.x2=s.x1+120; }
      if(s.type==='poly'){ s.r=60; }
    }
    afterCreate();
    render();
  }
  if(drag.mode==='pencil'){
    // 点を間引いて軽量化
    const pts = drag.s.pts;
    if(pts.length>3){
      const out=[pts[0]];
      for(let i=1;i<pts.length-1;i++){ if(dist(pts[i], out[out.length-1]) > 4/state.zoom) out.push(pts[i]); }
      out.push(pts[pts.length-1]);
      drag.s.pts = out;
    }
    afterCreate();
    render();
  }
  if(drag.mode==='move' && !drag.moved){
    // 動かさなかった場合：Shiftなしクリックで単独選択に絞る
    undoStack.pop(); // 無変更の履歴を破棄
    const idAttr = targetShapeId(e);
    if(idAttr && !e.shiftKey){ state.sel = new Set([+idAttr]); expandSelToGroups(); render(); }
  }
  drag = null;
  renderHandles();
});

window.addEventListener('pointercancel', e=>{
  touches.delete(e.pointerId);
  pinch = null;
  cancelActiveDrag();
});

function handleStageDbl(e){
  if(state.tool==='node'){
    // pointer captureでtargetがstageになるため、座標から最寄りのノードを探す
    const s = selShapes()[0];
    if(s && s.type==='path' && s.pts.length > 2){
      const p = toWorld(e);
      const thr = 8/state.zoom;
      let bi = -1, bd = Infinity;
      s.pts.forEach((pt,i)=>{ const d = Math.hypot(pt.x-p.x, pt.y-p.y); if(d < bd){ bd = d; bi = i; } });
      if(bi >= 0 && bd < thr){ pushHistory(); s.pts.splice(bi, 1); render(); }
    }
    return;
  }
  const idAttr = targetShapeId(e);
  if(idAttr){
    const s = state.shapes.find(x=>x.id===+idAttr);
    if(s && s.type==='text'){ state.sel=new Set([s.id]); render(); openTextEditor(s); }
    else if(s && isFrameShape(s)){ state.sel=new Set([s.id]); render(); openFrameTextEditor(s); }
  }
  if(state.tool==='pen' && pen && pen.pts.length>=2){ finishPen(false); render(); }
}
stage.addEventListener('dblclick', handleStageDbl);

stage.addEventListener('wheel', e=>{
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }else{
    state.panX -= e.deltaX; state.panY -= e.deltaY;
    updateWorld();
  }
},{passive:false});

function zoomAt(factor, cx, cy){
  const r = stage.getBoundingClientRect();
  const x = (cx!==undefined ? cx - r.left : r.width/2);
  const y = (cy!==undefined ? cy - r.top : r.height/2);
  const nz = clamp(state.zoom*factor, 0.05, 16);
  state.panX = x - (x - state.panX)*(nz/state.zoom);
  state.panY = y - (y - state.panY)*(nz/state.zoom);
  state.zoom = nz;
  render();
}
function zoomFit(){
  const r = stage.getBoundingClientRect();
  const m = 50;
  const z = clamp(Math.min((r.width-m*2)/state.doc.w, (r.height-m*2)/state.doc.h), 0.05, 16);
  state.zoom = z;
  state.panX = (r.width - state.doc.w*z)/2;
  state.panY = (r.height - state.doc.h*z)/2;
  render();
}

/* ================= 図形変換 ================= */
function translateShape(s, o, dx, dy){
  switch(s.type){
    case 'rect': s.x=o.x+dx; s.y=o.y+dy; break;
    case 'ellipse': s.cx=o.cx+dx; s.cy=o.cy+dy; break;
    case 'line': s.x1=o.x1+dx; s.y1=o.y1+dy; s.x2=o.x2+dx; s.y2=o.y2+dy; break;
    case 'poly': s.cx=o.cx+dx; s.cy=o.cy+dy; break;
    case 'path': s.pts=o.pts.map(p=>({x:p.x+dx, y:p.y+dy})); break;
    case 'text': s.x=o.x+dx; s.y=o.y+dy; break;
    case 'image': s.x=o.x+dx; s.y=o.y+dy; break;
  }
}
function bboxTransform(s, o, ob, nb){
  const sx = ob.w ? nb.w/ob.w : 1, sy = ob.h ? nb.h/ob.h : 1;
  const mx = x => nb.x + (ob.w ? (x-ob.x)/ob.w : 0)*nb.w;
  const my = y => nb.y + (ob.h ? (y-ob.y)/ob.h : 0)*nb.h;
  switch(s.type){
    case 'rect': s.x=mx(o.x); s.y=my(o.y); s.w=o.w*sx; s.h=o.h*sy; s.rx=(o.rx||0)*Math.min(sx,sy); break;
    case 'ellipse': s.cx=mx(o.cx); s.cy=my(o.cy); s.rx=o.rx*sx; s.ry=o.ry*sy; break;
    case 'line': s.x1=mx(o.x1); s.y1=my(o.y1); s.x2=mx(o.x2); s.y2=my(o.y2); break;
    case 'poly': s.cx=mx(o.cx); s.cy=my(o.cy); s.r=o.r*(sx+sy)/2; break;
    case 'path': s.pts=o.pts.map(p=>({x:mx(p.x), y:my(p.y)})); break;
    case 'text':
      s.x=mx(o.x); s.y=my(o.y); s.size=Math.max(4, o.size*sy);
      if(o.ls) s.ls = o.ls*sy;   // 文字間はフォントサイズに追従
      if(o.rubyLS) s.rubyLS = o.rubyLS*sy;
      if(o.rubyDy) s.rubyDy = o.rubyDy*sy;
      // 横方向のリサイズは折返幅の設定・調整として扱う
      if(o.boxW) s.boxW = Math.max(10, o.boxW*sx);
      else if(Math.abs(sx-1)>0.001 && ob.w>1) s.boxW = Math.max(10, nb.w);
      break;
    case 'image': s.x=mx(o.x); s.y=my(o.y); s.w=o.w*sx; s.h=o.h*sy; break;
  }
}

/* ================= ペン ================= */
function finishPen(close){
  if(!pen){ return; }
  const made = pen.pts.length>=2;
  if(made){
    pushHistory();
    const s = newShape('path',{pts:pen.pts, closed:!!close, smooth:false,
      fill: close ? styleNow.fill : 'none'});
    state.shapes.push(s);
    state.sel = new Set([s.id]);
  }
  // penを先にnullにしてからツールを戻す（setToolがfinishPenを呼ぶため）
  pen = null;
  overlayRenderPen();
  if(made) afterCreate();
}

/* ================= テキスト編集 ================= */
/* 画面上の文字入力枠を、入力済みの文字量に合わせた大きさにする */
function fitEditorToText(ta, fallback){
  const txt = ta.value || fallback || '';
  const lines = String(txt).split('\n');
  const cols = Math.max(8, ...lines.map(l=>[...l].reduce((n,c)=> n + (/[\x00-\xff]/.test(c)?1:2), 0)));
  ta.cols = Math.min(60, cols);
  ta.rows = Math.min(20, lines.length);
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
function openTextEditor(s){
  const ed = $('textEditor'), ta = $('textArea');
  const scr = toScreen({x:s.x, y:s.y - s.size});
  ed.style.left = scr.x+'px'; ed.style.top = scr.y+'px'; ed.style.display = 'block';
  ta.value = s.text;
  ta.style.fontSize = Math.max(12, s.size*state.zoom)+'px';
  ta.style.width = ''; ta.style.height = '';
  // 入力中も文字量に追従させる（既定で全文が見える大きさになる）
  const fit = ()=> fitEditorToText(ta, s.text);
  fit();
  ta.oninput = fit;
  ta.focus(); ta.select();
  const commit = ()=>{
    pushHistory();
    s.text = ta.value || 'テキスト';
    ed.style.display='none';
    ta.onblur = null; ta.onkeydown = null; ta.oninput = null;
    render();
  };
  ta.onblur = commit;
  ta.onkeydown = ev=>{
    ev.stopPropagation();
    if(ev.key==='Escape'){ ta.onblur=null; ta.oninput=null; ed.style.display='none'; render(); }
    if(ev.key==='Enter' && (ev.ctrlKey||ev.metaKey)) commit();
  };
}

function openFrameTextEditor(s){
  const ed = $('textEditor'), ta = $('textArea');
  // 入力枠は実際に文字が組まれる領域に重ねる（楕円・多角形では外接矩形と異なる）
  const box = frameTextBox(s);
  const scr = toScreen({x:box.x, y:box.y});
  const scrBR = toScreen({x:box.x+box.w, y:box.y+box.h});
  ed.style.left = scr.x+'px'; ed.style.top = scr.y+'px'; ed.style.display = 'block';
  ta.value = s.text || '';
  ta.style.fontSize = Math.max(12, (s.size||16)*state.zoom)+'px';
  ta.style.width = Math.max(40, scrBR.x-scr.x)+'px';
  ta.style.height = Math.max(24, scrBR.y-scr.y)+'px';
  // 枠内文字は枠の大きさが入力枠の大きさ。直前の通常テキスト編集の設定を持ち越さない
  ta.rows = 1; ta.removeAttribute('cols'); ta.oninput = null;
  ta.focus(); ta.select();
  const commit = ()=>{
    pushHistory();
    s.text = ta.value || undefined;
    if(s.text && !s.size) s.size = 16;
    autoFitFrame(s);
    ed.style.display='none';
    ta.style.width=''; ta.style.height='';
    ta.onblur = null; ta.onkeydown = null; ta.oninput = null;
    render();
  };
  ta.onblur = commit;
  ta.onkeydown = ev=>{
    ev.stopPropagation();
    if(ev.key==='Escape'){ ta.onblur=null; ed.style.display='none'; ta.style.width=''; ta.style.height=''; render(); }
    if(ev.key==='Enter' && (ev.ctrlKey||ev.metaKey)) commit();
  };
}

   boldは旧データ互換（太字チェックだった頃の保存値） */

  return key;                      // レジストリ外＝ユーザーが読み込んだ実ファミリ名そのもの

const GENERIC_FAMS = ['serif','sans-serif','monospace','cursive','fantasy','system-ui',
  'ui-serif','ui-sans-serif','ui-monospace','ui-rounded','inherit','initial'];
/* 実フォントが端末に入っているか。総称と描画幅が変われば実フォントが効いている */
function isFontAvailable(family){
  if(!family) return false;
  const name = String(family).replace(/["']/g,'').trim();
  if(!name || GENERIC_FAMS.includes(name.toLowerCase())) return false;
  const text = 'あぁ亜衣書体教科ABCgQ字0123', size = 72;
  const ctx = document.createElement('canvas').getContext('2d');
  const width = f =>{ ctx.font = size+'px '+f; return ctx.measureText(text).width; };
  return ['monospace','sans-serif','serif'].some(g=>{
    const base = width(g);
    return Math.abs(width('"'+name+'",'+g) - base) > 0.5;
  });

/* スタック文字列から、総称を除いた実ファミリ名の配列を返す */
