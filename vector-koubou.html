/* 選択中のシステム書体（オンライン以外）の実フォントが1つも見つからないか。
   probeを持つ書体は、代替用に末尾へ並べた別書体を判定から除く（代替が見つかると警告が出なくなるため） */
function selectedFontUnavailable(key){
  const f = FONTS[key];
  if(!f || f.gf) return false;                       // オンライン書体は取得されるので対象外
  if(state.webFonts.includes(key)) return false;     // 読み込み済みの実フォント
  if((state.customFonts||[]).some(c=>c.name===key)) return false;
  const fams = f.probe ? f.probe.slice() : stackFamilies(f.stack);
  return fams.length>0 && !fams.some(isFontAvailable);
}
/* オンライン書体のオンデマンド読み込み。明示的に選んだときだけ通信する */
const gfLoaded = new Set();
/* オンライン書体の指定は Family:wght@400;700 の形。任意の太さを使うときは、
   その太さも要求しないと近い太さで代用されてしまう。
   wght軸を持たない書体（Pacifico等）は太さ指定を足さない（要求すると取得に失敗するため） */
function gfSpecWithWeight(gf, weight){
  if(!weight || !/:wght@/.test(gf)) return gf;
  const [fam, axis] = gf.split(':wght@');
  const list = [...new Set(axis.split(';').concat(String(weight)))]
    .map(Number).filter(n=>n>=100&&n<=900).sort((a,b)=>a-b);
  return fam + ':wght@' + list.join(';');
}
/* 選ばれた太さがまだ読み込まれていなければ取得する */
function ensureWeightLoaded(key, weight){
  const f = FONTS[key];
  if(!f || !f.gf || !/:wght@/.test(f.gf)) return Promise.resolve(key);
  return ensureFontLoaded(key, weight);
}
function ensureFontLoaded(key, weight){
  const f = FONTS[key];
  if(!f || !f.gf) return Promise.resolve(key);
  const gf = gfSpecWithWeight(f.gf, weight);
  if(gfLoaded.has(gf)) return Promise.resolve(key);
  return new Promise(resolve=>{
    gfLoaded.add(gf);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + gf + '&display=swap';
    // フォント到着後に再描画（字形の寸法に依存する折返し計算をやり直すため）
    l.onload = ()=>{
      const done = ()=>{ render(true); resolve(key); };
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(done); else done();
    };
    l.onerror = ()=>{ gfLoaded.delete(gf); l.remove(); resolve(key); };
    document.head.appendChild(l);
    setTimeout(()=> resolve(key), 8000);
  });
}
/* データ中で使われているオンライン書体をまとめて読み込む（保存ファイルを開いたとき用） */
function ensureProjectFonts(){
  const use = new Map();
  (state.shapes||[]).forEach(s=>{
    if(!s.font) return;
    if(!use.has(s.font)) use.set(s.font, new Set());
    use.get(s.font).add(textWeight(s));
  });
  use.forEach((weights, k)=>{
    if(!(FONTS[k] && FONTS[k].gf)) return;
    weights.forEach(w=> ensureFontLoaded(k, w));
  });
}

/* ================= Webフォント（Google Fonts・フォントファイル） ================= */
function loadGoogleFont(name){
  const fam = String(name||'').trim();
  if(!fam) return Promise.reject(new Error('empty'));
  return new Promise((resolve, reject)=>{
    const finish = ()=> document.fonts.load(`16px "${fam}"`).then(fs=>{
      if(!fs.length) return reject(new Error('font not found'));
      if(!state.webFonts.includes(fam)) state.webFonts.push(fam);
      resolve(fam);
    }).catch(reject);
    const id = 'gf-' + fam.replace(/[^a-z0-9]/gi,'-');
    if(document.getElementById(id)){ finish(); return; }
    const l = document.createElement('link');
    l.id = id; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' +
      encodeURIComponent(fam).replace(/%20/g,'+') + ':wght@400;700&display=swap';
    l.onload = finish;
    l.onerror = ()=>{ l.remove(); reject(new Error('network error')); };
    document.head.appendChild(l);
    setTimeout(()=> reject(new Error('timeout')), 10000);
  });
}
function registerCustomFont(cf){
  return new FontFace(cf.name, `url(${cf.data})`).load().then(ff=>{
    document.fonts.add(ff);
    return cf.name;
  });
}
function reloadFonts(){
  // 保存データ復元時に、使用フォントを再読み込みして再描画
  (state.webFonts||[]).forEach(f=> loadGoogleFont(f).catch(()=>{}));
  (state.customFonts||[]).forEach(cf=> registerCustomFont(cf).then(()=>render(true)).catch(()=>{}));
}

/* フォント見本: 読み込み（読込ボタン）を押さなくても、選択・入力するだけで見た目を確認できる */
function isKnownFont(fam){
  return !!FONTS[fam] || state.webFonts.includes(fam) || (state.customFonts||[]).some(c=>c.name===fam);
}
let fontPreviewTimer = null;
function fontSampleText(one){
  return (one.text && String(one.text).trim()) ? String(one.text).slice(0,30) : 'AaBbあ漢字123';
}
function setFontPreviewSample(fam, sampleText){
  const pv = $('pFontPreview'); if(!pv) return;
  pv.style.fontFamily = fontFamilyAttr(fam);
  pv.textContent = sampleText;
}
/* 「書体」セレクト: 組み込み・読み込み済み・未読込のGoogleフォント候補をひとつのプルダウンにまとめ、
   未読込の候補を選ぶとその場で自動読込→適用まで行う（別途「読込」ボタンを押す必要がない） */
/* 書体セレクト: レジストリをグループ順にoptgroupで並べ、末尾にユーザーが読み込んだ書体を足す */
function fontSelectHTML(id, one){
  const loadedExtra = [...state.webFonts, ...(state.customFonts||[]).map(c=>c.name)]
    .filter(f=> !FONTS[f]);
  let html = `<select id="${id}" style="flex:1">`;
  FONT_GROUP_ORDER.forEach(group=>{
    const keys = Object.keys(FONTS).filter(k=> FONTS[k].group===group);
    if(!keys.length) return;
    html += `<optgroup label="${esc(group)}">` +
      keys.map(k=>`<option value="${esc(k)}">${esc(FONTS[k].label)}</option>`).join('') +
      `</optgroup>`;
  });
  if(loadedExtra.length){
    html += `<optgroup label="読み込み済み">` +
      loadedExtra.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('') + `</optgroup>`;
  }
  return html + `</select>`;
}
/* 選択中の書体が端末に無いときの警告と、候補フォントの診断表示 */
function fontWarnHTML(){
  return propRow(`<span id="pFontWarn" class="fontwarn" style="display:none"></span>`) +
    propRow(`<button id="pFontCheck" title="選択中の書体の候補フォントが、この端末に入っているか調べます">書体診断</button>
      <span id="pFontDiag" class="fontdiag" style="display:none"></span>`);
}
function updateFontMissingWarn(one){
  const w = $('pFontWarn'); if(!w) return;
  const key = one && one.font;
  if(key && selectedFontUnavailable(key)){
    const nm = (FONTS[key] && FONTS[key].label) || key;
    w.style.display = '';
    w.innerHTML = `⚠ この端末に「${esc(nm)}」の実フォントが見つかりません。近い代替書体で表示しています。` +
      `同じ字形で出すには、その書体を入れた端末で開くか「オンラインフォント」をお使いください。`;
  }else w.style.display = 'none';
}
function bindFontCheck(one){
  const btn = $('pFontCheck'); if(!btn) return;
  btn.onclick = ()=>{
    const key = one.font || 'sans-serif', f = FONTS[key];
    const out = $('pFontDiag');
    const fams = f ? stackFamilies(f.stack) : stackFamilies('"'+key+'"');
    const anyReal = fams.some(isFontAvailable);
    out.style.display = '';
    out.innerHTML = `<b>${esc((f&&f.label)||key)}</b> の候補フォント（この端末での判定）:<br>` +
      fams.map(n=>`${isFontAvailable(n)?'✓ 利用可':'× なし'}：${esc(n)}`).join('<br>') +
      `<br><b>→ ${anyReal?'実フォントで表示されています。':'実フォントは見つからず、総称による代替表示です。'}</b>`;
  };
}
let fontSwitchSeq = 0;
function bindFontSelect(id, one){
  const sel = $(id); if(!sel) return;
  sel.value = one.font||'sans-serif';
  sel.onchange = ()=>{
    const val = sel.value;
    const f = FONTS[val];
    // レジストリの書体: オンライン書体だけ取得が要る。取得を待たずに適用し、届いたら再描画する
    if(f){
      pushHistory(); one.font = val; autoFitFrame(one); render();
      if(f.gf) ensureFontLoaded(val, textWeight(one)).then(()=>{ if(isFrameShape(one)) autoFitFrame(one); render(); });
      return;
    }
    if(isKnownFont(val)){ pushHistory(); one.font = val; autoFitFrame(one); render(); return; }
    // 読込中もセレクトは操作可能なままにし、続けて別の書体へすぐ切り替えられるようにする。
    // 古い読込が後から完了しても、その間に選ばれた新しい書体を上書きしないよう世代番号で判定する。
    const seq = ++fontSwitchSeq;
    setFontPreviewSample(val, fontSampleText(one));
    loadGoogleFont(val).then(fam=>{
      if(seq !== fontSwitchSeq) return;
      pushHistory(); one.font = fam; autoFitFrame(one); render();
    }).catch(()=>{
      if(seq !== fontSwitchSeq) return;
      sel.value = one.font||'sans-serif';
      setFontPreviewSample(one.font||'sans-serif', fontSampleText(one));
      alert('フォントを読み込めませんでした。ネット接続を確認してください。');
    });
  };
}
function initFontPreview(one){
  const pv = $('pFontPreview'); if(!pv) return;
  setFontPreviewSample(one.font||'sans-serif', fontSampleText(one));
  const selEl = $('pFont') || $('pFrameFont');
  if(selEl) selEl.addEventListener('input', ()=> setFontPreviewSample(selEl.value, fontSampleText(one)));
  const nameEl = $('pFontName');
  if(nameEl) nameEl.addEventListener('input', ()=>{
    const name = nameEl.value.trim();
    if(!name) return;
    setFontPreviewSample(name, fontSampleText(one));
    clearTimeout(fontPreviewTimer);
    fontPreviewTimer = setTimeout(()=>{
      loadGoogleFont(name).then(fam=> setFontPreviewSample(fam, fontSampleText(one))).catch(()=>{});
    }, 400);
  });
}

/* ================= プロパティパネル ================= */
/* 印刷寸法。内部単位のpxは96dpi基準（1mm = 96/25.4 px）。
   実際の印刷解像度は書き出し倍率で決まる（×4なら384dpi） */
const PX_PER_MM = 96/25.4, DOC_MAX_MM = 1000;
const DOC_MAX_PX = DOC_MAX_MM*PX_PER_MM;
// pxは小数第2位まで保持する。整数に丸めるとmmとの往復で誤差が出て
// 「最大1000mm」の指定が1000.1mmと表示されてしまうため
function pxToMm(px){ return Math.round(px/PX_PER_MM*10)/10; }
function mmToPx(mm){ return Math.round(clamp(+mm||1, 1, DOC_MAX_MM)*PX_PER_MM*100)/100; }
function clampDocPx(px){ return Math.round(clamp(+px||1, 1, DOC_MAX_PX)*100)/100; }
function propRow(html){ return `<div class="prow">${html}</div>`; }
/* 入力欄の高さを中身に合わせる。既定で文字量に応じて広がり、長文でも全体が見える */
const TA_MIN_H = 34, TA_MAX_H = 260;
function autoGrowTextarea(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = clamp(el.scrollHeight + 2, TA_MIN_H, TA_MAX_H) + 'px';
  // 上限に達したときだけスクロールさせる
  el.style.overflowY = (el.scrollHeight + 2 > TA_MAX_H) ? 'auto' : 'hidden';
}
function bindAutoGrow(id){
  const el = $(id); if(!el) return;
  autoGrowTextarea(el);
  el.addEventListener('input', ()=> autoGrowTextarea(el));
}
/* 数値入力（キャプション工房と共通仕様）: 上下限と刻みを必ず与え、単位を併記する */
function numIn(id,label,val,step,min,max,unit){
  const lim = (min!==undefined?` min="${min}"`:'') + (max!==undefined?` max="${max}"`:'');
  const u = unit ? `<span style="font-size:10px;color:var(--muted)">${unit}</span>` : '';
  return propRow(`<label>${label}</label><input type="number" id="${id}" value="${fmt(val)}" step="${step||1}"${lim}>${u}`);
}
/* スライダー＋数値表示。ドラッグ中は即時反映し、値は等幅数字で右詰め表示する */
function rangeIn(id,label,val,min,max,step,unit,title){
  return propRow(`<label${title?` title="${esc(title)}"`:''}>${label}</label>` +
    `<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">` +
    `<output id="${id}O">${fmt(val)}${unit||''}</output>`);
}
/* ドラッグ中はプロパティ欄を作り直さず（つかんだつまみが消えるため）、履歴は掴んだ時に一度だけ積む */
function bindRange(id, fn, unit, decimals){
  const el = $(id); if(!el) return;
  const out = $(id+'O');
  const show = v=> out && (out.textContent = (decimals!=null ? (+v).toFixed(decimals) : fmt(v)) + (unit||''));
  // 1回の操作につき履歴は1件。連続したドラッグや矢印キー連打で履歴が埋まらないようにする
  let dirty = false;
  const begin = ()=>{ if(!dirty){ pushHistory(); dirty = true; } };
  const end = ()=>{ dirty = false; };
  el.addEventListener('pointerdown', begin);
  el.addEventListener('keydown', e=>{ if(/^(Arrow|Page|Home|End)/.test(e.key)) begin(); });
  el.addEventListener('pointerup', end);
  el.addEventListener('blur', end);
  el.addEventListener('change', end);
  el.oninput = ()=>{ begin(); const v = +el.value; fn(v); show(v); render(true); };
}
/* 色スウォッチ（クリックでドラッグ式ピッカーを開く）＋CMYK数値入力＋不透明度 */
function swatchHTML(id, hex, disabled){
  return `<button type="button" class="swatch" id="${id}Swatch" ${disabled?'disabled':''}>
    <span class="swatch-fill" style="background:${esc(hex)}"></span></button>`;
}
function colorInCMYK(id,label,val,alpha){
  const none = val==='none';
  const cm = none ? {c:0,m:0,y:0,k:0} : rgbToCmyk(hexToRgb(val).r, hexToRgb(val).g, hexToRgb(val).b);
  const dis = none ? 'disabled' : '';
  let html = propRow(`<label>${label}</label>
    ${swatchHTML(id, none?'#000000':val, none)}
    <label class="toggle"><input type="checkbox" id="${id}None" ${none?'checked':''}>なし</label>`);
  html += `<div class="prow cmykrow">
      <span class="cmyklab">C</span><input type="number" id="${id}C" min="0" max="100" value="${cm.c}" ${dis}>
      <span class="cmyklab">M</span><input type="number" id="${id}M" min="0" max="100" value="${cm.m}" ${dis}>
      <span class="cmyklab">Y</span><input type="number" id="${id}Y" min="0" max="100" value="${cm.y}" ${dis}>
      <span class="cmyklab">K</span><input type="number" id="${id}K" min="0" max="100" value="${cm.k}" ${dis}>
    </div>`;
  if(alpha!==undefined){
    html += propRow(`<label>不透明</label><input type="range" id="${id}Alpha" min="0" max="1" step="0.01" value="${alpha}" ${none?'disabled':''} style="flex:1"><span id="${id}AlphaVal">${Math.round(alpha*100)}%</span>`);
  }
  return html;
}
function fillTypeOf(v){ return (v && typeof v==='object') ? v.type : 'solid'; }
function fillPanel(one){
  const v = one.fill;
  const type = fillTypeOf(v);
  let html = `<div class="prow"><label>塗り</label><select id="pFillType">
      <option value="solid" ${type==='solid'?'selected':''}>単色</option>
      <option value="linear" ${type==='linear'?'selected':''}>線形グラデーション</option>
      <option value="radial" ${type==='radial'?'selected':''}>放射グラデーション</option>
    </select></div>`;
  if(type==='solid'){
    html += colorInCMYK('pFill','　', v, one.fillAlpha);
  }else{
    const stops = v.stops || [{offset:0,color:'#d8d1c2'},{offset:1,color:'#33312e'}];
    html += propRow(`<label>色1</label>${swatchHTML('pGrad0', stops[0].color)}
      <label>色2</label>${swatchHTML('pGrad1', stops[1].color)}`);
    if(type==='linear'){
      html += propRow(`<label>角度</label><input type="range" id="pGradAngle" min="0" max="360" value="${v.angle||0}" style="flex:1"><span id="pGradAngleVal">${v.angle||0}°</span>`);
    }
    html += propRow(`<label>不透明</label><input type="range" id="pFillAlpha" min="0" max="1" step="0.01" value="${one.fillAlpha}" style="flex:1"><span id="pFillAlphaVal">${Math.round(one.fillAlpha*100)}%</span>`);
  }
  return html;
}
function bindFillPanel(one){
  // 線は塗り欄を持たない。ここで落ちると以降の束縛（線種・矢印など）が全て失われる
  const pft = $('pFillType');
  if(!pft) return;
  pft.onchange = ()=>{
    pushHistory();
    const t = pft.value;
    if(t==='solid'){
      const cur = one.fill;
      one.fill = (cur && cur.stops && cur.stops[0]) ? cur.stops[0].color : (typeof cur==='string' ? cur : '#d8d1c2');
    }else{
      const cur = one.fill;
      const baseStops = (cur && cur.stops) ? cur.stops.map(s=>({...s})) :
        [{offset:0, color:(typeof cur==='string' && cur!=='none') ? cur : '#d8d1c2'}, {offset:1, color:'#33312e'}];
      one.fill = {type:t, stops:baseStops, angle:(cur && cur.angle) || 0};
    }
    render();
  };
  if(fillTypeOf(one.fill)==='solid'){
    bindColorCMYK('pFill','fill','fillAlpha');
  }else{
    const sw0 = $('pGrad0Swatch'), sw1 = $('pGrad1Swatch'), pga = $('pGradAngle');
    const paintSwatch = (sw,hex)=> sw.querySelector('.swatch-fill').style.background = hex;
    sw0.onclick = ()=>{ pushHistory(); openColorPicker(sw0, one.fill.stops[0].color, hex=>{ one.fill.stops[0].color=hex; paintSwatch(sw0,hex); updateGradientDefs(); }); };
    sw1.onclick = ()=>{ pushHistory(); openColorPicker(sw1, one.fill.stops[1].color, hex=>{ one.fill.stops[1].color=hex; paintSwatch(sw1,hex); updateGradientDefs(); }); };
    if(pga){
      pga.addEventListener('pointerdown', ()=> pushHistory());
      pga.oninput = ()=>{ one.fill.angle = +pga.value; $('pGradAngleVal').textContent = pga.value+'°'; updateGradientDefs(); };
    }
    const al = $('pFillAlpha'), alv = $('pFillAlphaVal');
    al.addEventListener('pointerdown', ()=> pushHistory());
    al.oninput = ()=>{ one.fillAlpha = +al.value; alv.textContent = Math.round(al.value*100)+'%'; render(true); };
  }
}

      propRow(`<label>背景</label><input type="color" id="docBg" value="${state.doc.bg==='none'?'#ffffff':state.doc.bg}">`) +

/* 色スウォッチ（ドラッグ式ピッカー）＋CMYK＋不透明度 を key に束縛 */
function bindColorCMYK(base, key, alphaKey){
  const sw = $(base+'Swatch'), n = $(base+'None');
  if(!sw) return;
  const curColor = ()=>{ const s = selShapes()[0]; return s ? s[key] : styleNow[key]; };
  // スウォッチクリックでドラッグ式ピッカーを開く（セッション単位で1回だけ履歴を積む）
  sw.onclick = ()=>{
    if(sw.disabled) return;
    pushHistory();
    openColorPicker(sw, curColor()==='none' ? '#000000' : curColor(), hex=>{
      selShapes().forEach(s=>s[key]=hex); styleNow[key]=hex;
      sw.querySelector('.swatch-fill').style.background = hex;
      render(true);
    });
  };
  n.onchange = ()=>{ pushHistory();
    const v = n.checked ? 'none' : (curColor()==='none' ? styleNow[key] : curColor());
    selShapes().forEach(s=>s[key]=v); styleNow[key]=v; render(); };
  // CMYK欄の編集はパネルを再構築せず、入力値をそのまま保持（RGB往復による値の揺れを防ぐ）
  const cc=$(base+'C'), cm=$(base+'M'), cy=$(base+'Y'), ck=$(base+'K');
  const fromCMYK = ()=>{
    const hex = cmykToHex(+cc.value||0, +cm.value||0, +cy.value||0, +ck.value||0);
    pushHistory();
    selShapes().forEach(s=>s[key]=hex); styleNow[key]=hex;
    sw.querySelector('.swatch-fill').style.background = hex;
    render(true);
  };
  [cc,cm,cy,ck].forEach(inp=>{ if(inp) inp.onchange = fromCMYK; });
  if(alphaKey){
    const al = $(base+'Alpha'), alv = $(base+'AlphaVal');
    if(al){
      al.addEventListener('pointerdown', ()=> pushHistory());
      al.oninput = ()=>{
        const v = +al.value;
        selShapes().forEach(s=>s[alphaKey]=v); styleNow[alphaKey]=v;
        if(alv) alv.textContent = Math.round(v*100)+'%';
        render(true);
      };
    }
  }
}

/* ================= 整列・重ね順 ================= */
function align(mode){
  const ss = selShapes(); if(!ss.length) return;
  pushHistory();
  if(mode==='dh' || mode==='dv'){
    if(ss.length < 3){ undoStack.pop(); return; }
    const horiz = mode==='dh';
    const items = ss.map(s=>({s, b:renderBBox(s)}))
      .sort((a,b)=> horiz ? (a.b.x+a.b.w/2)-(b.b.x+b.b.w/2) : (a.b.y+a.b.h/2)-(b.b.y+b.b.h/2));
    const cAt = it => horiz ? it.b.x+it.b.w/2 : it.b.y+it.b.h/2;
    const c0 = cAt(items[0]), c1 = cAt(items[items.length-1]);
    const step = (c1-c0)/(items.length-1);
    items.forEach((it,i)=>{
      const d = c0 + step*i - cAt(it);
      const o = JSON.parse(JSON.stringify(it.s));
      translateShape(it.s, o, horiz?d:0, horiz?0:d);
    });
    render();
    return;
  }
  const ref = ss.length>1 ? selBBox() : {x:0, y:0, w:state.doc.w, h:state.doc.h};
  ss.forEach(s=>{
    const b = renderBBox(s), o = JSON.parse(JSON.stringify(s));
    let dx=0, dy=0;
    if(mode==='l') dx = ref.x - b.x;
    if(mode==='r') dx = ref.x+ref.w - (b.x+b.w);
    if(mode==='cx') dx = ref.x+ref.w/2 - (b.x+b.w/2);
    if(mode==='t') dy = ref.y - b.y;
    if(mode==='b') dy = ref.y+ref.h - (b.y+b.h);
    if(mode==='cy') dy = ref.y+ref.h/2 - (b.y+b.h/2);
    translateShape(s, o, dx, dy);
  });
  render();
}
function reorder(mode){
  const sel = state.sel; if(!sel.size) return;
  pushHistory();
  const picked = state.shapes.filter(s=>sel.has(s.id));
  const rest = state.shapes.filter(s=>!sel.has(s.id));
  if(mode==='front') state.shapes = [...rest, ...picked];
  else if(mode==='back') state.shapes = [...picked, ...rest];
  else{
    const arr = state.shapes;
    if(mode==='up'){
      for(let i=arr.length-2;i>=0;i--)
        if(sel.has(arr[i].id) && !sel.has(arr[i+1].id)) [arr[i],arr[i+1]]=[arr[i+1],arr[i]];
    }else{
      for(let i=1;i<arr.length;i++)
        if(sel.has(arr[i].id) && !sel.has(arr[i-1].id)) [arr[i],arr[i-1]]=[arr[i-1],arr[i]];
    }
  }
  render();
}

/* ================= 編集操作 ================= */
function deleteSel(){
  if(!state.sel.size) return;
  pushHistory();
  state.shapes = state.shapes.filter(s=>!state.sel.has(s.id));
  state.sel.clear();
  render();
}
function copySel(){
  clipboard = JSON.parse(JSON.stringify(selShapes()));
  if(clipboard.length && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText('vector-koubou:'+JSON.stringify(clipboard)).catch(()=>{});
  }
}
function paste(list){
  const src = list || clipboard;
  if(!src.length) return;
  pushHistory();
  const ids = [], gmap = {};
  src.forEach(c=>{
    const s = JSON.parse(JSON.stringify(c));
    s.id = idSeq++;
    if(s.groupId){ gmap[s.groupId] = gmap[s.groupId] || ('g'+(groupSeq++)); s.groupId = gmap[s.groupId]; }
    s.name = String(s.name||'').replace(/ \d+$/,'') + ' ' + s.id;
    translateShape(s, JSON.parse(JSON.stringify(s)), 16, 16);
    state.shapes.push(s);
    ids.push(s.id);
  });
  state.sel = new Set(ids);
  render();
}
function pasteShapesJSON(json){
  try{
    const arr = JSON.parse(json);
    if(Array.isArray(arr) && arr.length) paste(arr);
  }catch(err){ /* 不正なデータは無視 */ }
}
function duplicateSel(){ copySel(); paste(); }

/* ---- グループ化 ---- */
function groupSel(){
  const ss = selShapes();
  if(ss.length < 2) return;
  pushHistory();
  const gid = 'g'+(groupSeq++);
  ss.forEach(s=> s.groupId = gid);
  render();
}
function ungroupSel(){
  const ss = selShapes().filter(s=>s.groupId);
  if(!ss.length) return;
  pushHistory();
  ss.forEach(s=> delete s.groupId);
  render();
}
function expandSelToGroups(){
  const gids = new Set();
  selShapes().forEach(s=>{ if(s.groupId) gids.add(s.groupId); });
  if(!gids.size) return;
  state.shapes.forEach(s=>{ if(s.groupId && gids.has(s.groupId)) state.sel.add(s.id); });
}

/* ---- ノード編集・スポイト用ヘルパー ---- */
function distToSeg(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y;
  const L2 = dx*dx + dy*dy;
  const t = L2 ? clamp(((p.x-a.x)*dx + (p.y-a.y)*dy)/L2, 0, 1) : 0;
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function nearestSegment(pts, p, closed){
  let best = 0, bd = Infinity;
  const n = closed ? pts.length : pts.length-1;
  for(let i=0;i<n;i++){
    const d = distToSeg(p, pts[i], pts[(i+1)%pts.length]);
    if(d < bd){ bd = d; best = i; }
  }
  return best;
}
function applyStyleFrom(src){
  const targets = selShapes().filter(s=>s.id!==src.id);
  if(targets.length){
    pushHistory();
    targets.forEach(s=>{
      if(s.type==='image'){ s.opacity = src.opacity; return; }
      s.stroke = src.stroke; s.strokeWidth = src.strokeWidth; s.strokeAlpha = src.strokeAlpha;
      s.opacity = src.opacity; s.dash = src.dash;
      if(s.type!=='line' && src.type!=='line' && src.type!=='image' && src.fill!==undefined){
        s.fill = (src.fill && typeof src.fill==='object') ? JSON.parse(JSON.stringify(src.fill)) : src.fill;
        s.fillAlpha = src.fillAlpha;
      }
    });
  }
  if(src.type!=='image'){
    if(typeof src.fill==='string' && src.type!=='line'){ styleNow.fill = src.fill; styleNow.fillAlpha = src.fillAlpha; }
    styleNow.stroke = src.stroke; styleNow.strokeWidth = src.strokeWidth; styleNow.opacity = src.opacity;
    styleNow.strokeAlpha = src.strokeAlpha;
  }
  render();
  $('hint').textContent = src.name + ' のスタイルを' + (targets.length ? '選択中の図形に適用しました' : '取得しました');
}
function syncStyleFromSel(){
  const s = selShapes()[0];
  if(!s) return;
  if(s.type!=='line' && typeof s.fill==='string'){ styleNow.fill = s.fill; styleNow.fillAlpha = s.fillAlpha; }
  styleNow.stroke = s.stroke; styleNow.strokeWidth = s.strokeWidth; styleNow.opacity = s.opacity;
  styleNow.strokeAlpha = s.strokeAlpha;
}

/* ================= 上位レイヤー操作 ================= */
function addLayer(){
  pushHistory();
  const l = newLayer();
  const idx = state.layers.findIndex(x=>x.id===state.activeLayer);
  state.layers.splice(idx<0 ? state.layers.length : idx+1, 0, l);
  state.activeLayer = l.id;
  render();
}
function deleteLayer(id){
  if(state.layers.length <= 1){ alert('最後のレイヤーは削除できません。'); return; }
  const l = state.layers.find(x=>x.id===id); if(!l) return;
  const cnt = state.shapes.filter(s=>s.layerId===id).length;
  if(cnt && !confirm(`レイヤー「${l.name}」内の${cnt}個のオブジェクトも削除されます。よろしいですか？`)) return;
  pushHistory();
  state.shapes = state.shapes.filter(s=>s.layerId!==id);
  state.layers = state.layers.filter(x=>x.id!==id);
  if(state.activeLayer===id) state.activeLayer = state.layers[state.layers.length-1].id;
  pruneSel(); render();
}
function reorderLayer(id, dir){
  const i = state.layers.findIndex(l=>l.id===id); if(i<0) return;
  const j = dir==='up' ? i+1 : i-1;   // up = 前面へ（配列後方）
  if(j<0 || j>=state.layers.length) return;
  pushHistory();
  [state.layers[i], state.layers[j]] = [state.layers[j], state.layers[i]];
  render();
}
function moveSelToLayer(id){
  const ss = selShapes(); if(!ss.length) return;
  pushHistory();
  ss.forEach(s=> s.layerId = id);
  state.activeLayer = id;
  render();
}
function toggleLayer(l, key){ pushHistory(); l[key] = !l[key]; render(); }

/* ================= レイヤーパネル ================= */
const IC = {
  eye:'<svg viewBox="0 0 20 20"><path d="M2 10 C5 5.5, 15 5.5, 18 10 C15 14.5, 5 14.5, 2 10 Z"/><circle cx="10" cy="10" r="2.4"/></svg>',
  lock:'<svg viewBox="0 0 20 20"><rect x="5" y="9" width="10" height="7" rx="1"/><path d="M7 9 V7 a3 3 0 0 1 6 0 V9"/></svg>',
  unlock:'<svg viewBox="0 0 20 20"><rect x="5" y="9" width="10" height="7" rx="1"/><path d="M7 9 V7 a3 3 0 0 1 6 0"/></svg>',
  up:'<svg viewBox="0 0 20 20"><path d="M10 15 V5 M6 9 L10 5 L14 9"/></svg>',
  down:'<svg viewBox="0 0 20 20"><path d="M10 5 V15 M6 11 L10 15 L14 11"/></svg>',
};
function nameEditor(span, cur, commitFn){
  const input = document.createElement('input');
  input.value = cur;
  span.textContent=''; span.appendChild(input); input.focus(); input.select();
  const done = ()=>{ commitFn(input.value); };
  input.onblur = done;
  input.onkeydown = ev=>{ ev.stopPropagation(); if(ev.key==='Enter') done(); if(ev.key==='Escape') render(); };
}
function shapeRow(s){
  const row = document.createElement('div');
  row.className = 'layer layerobj' + (state.sel.has(s.id) ? ' sel' : '');
  row.innerHTML =
    `<button class="lic ${s.visible?'':'off'}" data-a="vis" title="表示/非表示">${IC.eye}</button>` +
    `<button class="lic ${s.locked?'':'off'}" data-a="lock" title="ロック">${s.locked?IC.lock:IC.unlock}</button>` +
    `<span class="lname" title="ダブルクリックで名前変更">${esc(s.name)}${s.groupId ? ` <span style="color:var(--muted); font-size:10px">[${esc(String(s.groupId).toUpperCase())}]</span>` : ''}</span>` +
    `<button class="lic" data-a="up" title="前面へ">${IC.up}</button>` +
    `<button class="lic" data-a="down" title="背面へ">${IC.down}</button>`;
  row.onclick = e=>{
    const a = e.target.closest('[data-a]');
    if(a){
      const act = a.dataset.a;
      if(act==='vis') toggleLayer(s, 'visible');
      if(act==='lock') toggleLayer(s, 'locked');
      if(act==='up'||act==='down'){ state.sel=new Set([s.id]); reorder(act); }
      return;
    }
    if(e.shiftKey){ state.sel.has(s.id) ? state.sel.delete(s.id) : state.sel.add(s.id); }
    else state.sel = new Set([s.id]);
    state.activeLayer = s.layerId;
    render();
  };
  row.querySelector('.lname').ondblclick = e=>{
    e.stopPropagation();
    nameEditor(e.currentTarget, s.name, v=>{ pushHistory(); s.name = v || s.name; render(); });
  };
  return row;
}
function renderLayers(){
  const el = $('layers');
  ensureLayers();
  el.innerHTML = '';
  // 前面のレイヤーを上に表示（配列を逆順で描画）
  [...state.layers].reverse().forEach(layer=>{
    const head = document.createElement('div');
    head.className = 'layer layerhead' + (state.activeLayer===layer.id ? ' active' : '');
    head.innerHTML =
      `<button class="ltri" data-la="collapse" title="開閉">${layer.collapsed?'▸':'▾'}</button>` +
      `<button class="lic ${layer.visible?'':'off'}" data-la="vis" title="表示/非表示">${IC.eye}</button>` +
      `<button class="lic ${layer.locked?'':'off'}" data-la="lock" title="ロック">${layer.locked?IC.lock:IC.unlock}</button>` +
      `<span class="lname" title="クリックで選択先に設定／ダブルクリックで名前変更">${esc(layer.name)}</span>` +
      `<button class="lic" data-la="moveHere" title="選択中のオブジェクトをこのレイヤーへ移動">⇐</button>` +
      `<button class="lic" data-la="up" title="前面へ">${IC.up}</button>` +
      `<button class="lic" data-la="down" title="背面へ">${IC.down}</button>` +
      `<button class="lic ldel" data-la="del" title="レイヤー削除">✕</button>`;
    head.onclick = e=>{
      const a = e.target.closest('[data-la]');
      if(a){
        const act = a.dataset.la;
        if(act==='collapse'){ layer.collapsed = !layer.collapsed; render(); }
        if(act==='vis') toggleLayer(layer, 'visible');
        if(act==='lock') toggleLayer(layer, 'locked');
        if(act==='moveHere') moveSelToLayer(layer.id);
        if(act==='up') reorderLayer(layer.id, 'up');
        if(act==='down') reorderLayer(layer.id, 'down');
        if(act==='del') deleteLayer(layer.id);
        return;
      }
      state.activeLayer = layer.id;
      render();
    };
    head.querySelector('.lname').ondblclick = e=>{
      e.stopPropagation();
      nameEditor(e.currentTarget, layer.name, v=>{ pushHistory(); layer.name = v || layer.name; render(); });
    };
    el.appendChild(head);
    if(!layer.collapsed){
      const inLayer = state.shapes.filter(s=>s.layerId===layer.id);
      [...inLayer].reverse().forEach(s=> el.appendChild(shapeRow(s)));
      if(!inLayer.length){
        const empty = document.createElement('div');
        empty.className = 'layer layerobj';
        empty.style.cssText = 'color:var(--muted); cursor:default; font-size:11px;';
        empty.textContent = '（空のレイヤー）';
        el.appendChild(empty);
      }
    }
  });
}

/* ================= 入出力 ================= */
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function buildSVGString(){
  const d = state.doc;
  let out = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${d.w}" height="${d.h}" viewBox="0 0 ${d.w} ${d.h}">`;
  const defs = dynamicDefStrings();
  if(defs.length) out += '<defs>'+defs.join('')+'</defs>';
  if(d.bg && d.bg!=='none') out += `<rect width="${d.w}" height="${d.h}" fill="${d.bg}"/>`;
  const ser = new XMLSerializer();
  state.shapes.forEach(s=>{ if(shapeVisible(s)) out += ser.serializeToString(shapeEl(s,false)); });
  out += '</svg>';
  return out;
}
/* ---- 書き出し用フォント埋め込み ----
   Webフォント使用時、<img>経由のラスタライズは外部リソースを取得できないため
   フォントをdata URIとしてSVGに埋め込む。text=で使用文字のみのサブセットを要求。 */
/* 書き出しに埋め込むフォント → 使用文字。キーはCSSで参照される実ファミリ名。
   端末インストール前提の書体（BIZ UD・游・ヒラギノ等）は配布物が無いので埋め込まない＝
   スタックの後続候補で表示される（キャプション工房と同じ扱い） */
function usedWebFonts(){
  const map = new Map();
  state.shapes.forEach(s=>{
    if(!shapeVisible(s) || !(s.type==='text' || isFrameShape(s)) || !s.text || !s.font) return;
    const f = FONTS[s.font];
    // レジストリ書体はオンライン書体（gf持ち）だけが埋め込み対象
    const fam = f ? (f.gf ? (f.family || s.font) : null) : s.font;
    if(!fam || GENERIC_FAMS.includes(String(fam).toLowerCase())) return;
    const cur = map.get(fam) || {text:'', weights:new Set()};
    cur.text += s.text;
    cur.weights.add(textWeight(s));   // 使っている太さだけを埋め込む
    map.set(fam, cur);
  });
  return map;
}
async function fontEmbedCSS(){
  let css = '';
  for(const [fam, use] of usedWebFonts()){
    const cf = (state.customFonts||[]).find(c=>c.name===fam);
    if(cf){ css += `@font-face{font-family:"${fam}";src:url(${cf.data});}`; continue; }
    try{
      const uniq = [...new Set(use.text)].join('');
      const wl = [...use.weights].sort((a,b)=>a-b).join(';') || '400';
      const url = 'https://fonts.googleapis.com/css2?family=' +
        encodeURIComponent(fam).replace(/%20/g,'+') + ':wght@' + wl + '&display=swap' +
        '&text=' + encodeURIComponent(uniq);
      let txt = await (await fetch(url)).text();
      for(const u of new Set([...txt.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))){
        const bytes = new Uint8Array(await (await fetch(u)).arrayBuffer());
        let bin = '';
        for(let i=0; i<bytes.length; i+=0x8000)
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
        txt = txt.split(u).join('data:font/woff2;base64,' + btoa(bin));
      }
      css += txt;
    }catch(err){ /* オフライン時はフォント埋め込みなしで続行 */ }
  }
  return css;
}
async function buildSVGStringWithFonts(){
  const svg = buildSVGString();
  const css = await fontEmbedCSS();
  return css ? svg.replace(/^(<svg[^>]*>)/, (m,p1)=> p1 + '<style>' + css + '</style>') : svg;
}
/* 保存・書き出しのファイル名。既定でその日の日付を末尾に付ける（キャプション工房と同じ _YYYYMMDD 形式）。
   すでに日付で終わっている名前には重ねて付けない */
function stampYMD(d){
  const t = d || new Date(), pad = n=> String(n).padStart(2,'0');
  return `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}`;
}
function fnameBase(){
  const name = ($('fname').value || 'design').trim() || 'design';
  const chk = $('chkDateStamp');
  if(chk && !chk.checked) return name;
  if(/[_-]\d{8}$/.test(name)) return name;
  return name + '_' + stampYMD();
}
function exportSVG(){
  buildSVGStringWithFonts().then(svg=>
    download(fnameBase()+'.svg', new Blob([svg], {type:'image/svg+xml'})));
}
/* 書き出し倍率。ブラウザのcanvas上限（辺16384px・面積約2.68億px）を超えると
   描画が空になるため、収まる範囲まで自動的に引き下げる */
const CANVAS_MAX_SIDE = 16384, CANVAS_MAX_AREA = 268435456;
/* 配置画像を1画素も落とさずに書き出すのに必要な倍率。
   Illustrator等の高精細画像を縮小配置しても、元の画素数を保ったまま出力できる */
function nativeImageScale(){
  let need = 1;
  state.shapes.forEach(s=>{
    if(s.type!=='image' || !shapeVisible(s) || !s.natW || !s.w) return;
    need = Math.max(need, s.natW/s.w, (s.natH||0)/(s.h||1));
  });
  return Math.ceil(need*100)/100;
}
function exportScale(){
  const sel = $('expScale');
  return clampExportScale(requestedScale(sel ? sel.value : '2')).scale;
}
function requestedScale(v){
  return v==='native' ? nativeImageScale() : (+v || 2);
}
function clampExportScale(scale){
  const w = state.doc.w, h = state.doc.h;
  let s = scale;
  s = Math.min(s, CANVAS_MAX_SIDE/w, CANVAS_MAX_SIDE/h, Math.sqrt(CANVAS_MAX_AREA/(w*h)));
  s = Math.max(0.1, Math.floor(s*100)/100);
  return {scale: Math.min(scale, s), capped: s < scale};
}
function updateExportHint(){
  const el = $('expSizeHint'); if(!el) return;
  const sel = $('expScale');
  const want = requestedScale(sel ? sel.value : '2');
  const {scale, capped} = clampExportScale(want);
  const w = Math.round(state.doc.w*scale), h = Math.round(state.doc.h*scale);
  let txt = `${w} × ${h} px / ${Math.round(96*scale)}dpi`;
  if(sel && sel.value==='native') txt += `（画像原寸 ×${want}）`;
  if(capped) txt += `（上限により×${scale}に縮小）`;
  // 画像を縮小してしまう場合は警告
  const need = nativeImageScale();
  if(need > scale + 0.005) txt += ` ⚠ 配置画像が縮小されます（原寸には×${need}必要）`;
  el.textContent = txt;
}
function rasterize(scale, forceOpaque, cb){
  buildSVGStringWithFonts().then(svg=> rasterizeSVG(svg, scale, forceOpaque, cb));
}
function rasterizeSVG(svg, scale, forceOpaque, cb){
  const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = Math.round(state.doc.w*scale); c.height = Math.round(state.doc.h*scale);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    if(forceOpaque){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height); }
    // 幅・高さを明示してdrawImageさせる（倍率指定より端数に強い）
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    cb(c);
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); alert('書き出しに失敗しました。'); };
  img.src = url;
}
function exportPNG(){
  rasterize(exportScale(), false, c=> c.toBlob(b=> download(fnameBase()+'.png', b), 'image/png'));
}
function exportJPEG(){
  rasterize(exportScale(), true, c=> c.toBlob(b=> download(fnameBase()+'.jpg', b), 'image/jpeg', 0.95));
}
function exportPDF(){
  rasterize(exportScale(), true, c=> c.toBlob(b=>{
    b.arrayBuffer().then(buf=> buildPDF(new Uint8Array(buf), c.width, c.height, exportScale()));
  }, 'image/jpeg', 0.95));
}
function buildPDF(jpegBytes, wPx, hPx, scale){
  const enc = new TextEncoder();
  const parts = [];
  let offset = 0;
  const offsets = [0];
  function addPart(data){
    const bytes = typeof data==='string' ? enc.encode(data) : data;
    parts.push(bytes);
    offset += bytes.length;
  }
  function beginObj(num){ offsets[num]=offset; addPart(num+' 0 obj\n'); }

  addPart('%PDF-1.4\n');
  beginObj(1); addPart('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  beginObj(2); addPart('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  // 用紙サイズは倍率によらず一定に保ち、倍率は埋め込み画像の精細さ（実効dpi）として効かせる
  const s = scale || 1;
  const wPt = fmt(wPx/s*72/96), hPt = fmt(hPx/s*72/96);
  beginObj(3); addPart(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wPt} ${hPt}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>\nendobj\n`);
  beginObj(4);
  addPart(`<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  addPart(jpegBytes);
  addPart('\nendstream\nendobj\n');
  const content = `q ${wPt} 0 0 ${hPt} 0 0 cm /Im0 Do Q`;
  beginObj(5); addPart(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);

  const xrefStart = offset;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++){ xref += String(offsets[i]).padStart(10,'0') + ' 00000 n \n'; }
  addPart(xref);
  addPart(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  download(fnameBase()+'.pdf', new Blob(parts, {type:'application/pdf'}));
}
function saveJSON(){
  const data = {app:'vector-koubou', version:1, fname:$('fname').value,
    doc:state.doc, shapes:state.shapes, layers:state.layers, activeLayer:state.activeLayer,
    idSeq, groupSeq, layerSeq, guides:state.guides,
    webFonts:state.webFonts, customFonts:state.customFonts};
  download(fnameBase()+'.json', new Blob([JSON.stringify(data,null,1)], {type:'application/json'}));
}
function openJSON(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const data = JSON.parse(fr.result);
      if(!Array.isArray(data.shapes)) throw new Error('形式が不正');
      pushHistory();
      state.doc = data.doc || state.doc;
      state.shapes = data.shapes;
      backfillImageNat();
      ensureProjectFonts();
      state.layers = Array.isArray(data.layers) ? data.layers : [];
      state.activeLayer = data.activeLayer || null;
      state.guides = data.guides || state.guides;
      idSeq = data.idSeq || (Math.max(0,...state.shapes.map(s=>s.id))+1);
      groupSeq = data.groupSeq || groupSeq;
      layerSeq = data.layerSeq || (Math.max(0,...state.layers.map(l=>+String(l.id).replace(/\D/g,'')||0))+1);
      ensureLayers();
      state.webFonts = Array.isArray(data.webFonts) ? data.webFonts : [];
      state.customFonts = Array.isArray(data.customFonts) ? data.customFonts : [];
      reloadFonts();
      if(data.fname) $('fname').value = data.fname;
      state.sel.clear();
      zoomFit();
    }catch(err){
      alert('ファイルを読み込めませんでした。ベクターデザイン工房で保存した .json を指定してください。');
    }
  };
  fr.readAsText(file);
}

/* ---- 各種ファイルのインポート ---- */
function importFile(file){
  if(file.type==='image/svg+xml' || /\.svg$/i.test(file.name)) importSVG(file);
  else if(file.type==='application/json' || /\.json$/i.test(file.name)) openJSON(file);
  else importImage(file);
}
/* 旧バージョンで保存した画像には原寸情報が無いため、読み込み後に補う */
function backfillImageNat(){
  (state.shapes||[]).forEach(s=>{
    if(s.type!=='image' || s.natW || !s.src) return;
    const im = new Image();
    im.onload = ()=>{ s.natW = im.naturalWidth; s.natH = im.naturalHeight; };
    im.src = s.src;
  });
}
function placeImage(src, natW, natH){
  const maxW = state.doc.w*0.8, maxH = state.doc.h*0.8;
  let w = natW || 200, h = natH || 200;
  const k = Math.min(1, maxW/w, maxH/h);
  w *= k; h *= k;
  pushHistory();
  // 元画像の画素数を保持し、書き出し時に必要な倍率を割り出せるようにする
  const s = newShape('image', {x:(state.doc.w-w)/2, y:(state.doc.h-h)/2, w, h, src,
    natW: natW || undefined, natH: natH || undefined});
  state.shapes.push(s);
  state.sel = new Set([s.id]);
  render();
}
const scriptCache = {};
function loadScript(src){
  if(!scriptCache[src]) scriptCache[src] = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = src;
    sc.onload = res;
    sc.onerror = ()=>{ delete scriptCache[src]; sc.remove(); rej(new Error('script load failed')); };
    document.head.appendChild(sc);
  });
  return scriptCache[src];
}
function decodeTIFF(file){
  return loadScript('https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js')
    .then(()=> file.arrayBuffer())
    .then(buf=>{
      const ifds = UTIF.decode(buf);
      if(!ifds.length) throw new Error('no image');
      UTIF.decodeImage(buf, ifds[0]);
      const rgba = UTIF.toRGBA8(ifds[0]);
      const c = document.createElement('canvas');
      c.width = ifds[0].width; c.height = ifds[0].height;
      c.getContext('2d').putImageData(
        new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.length), c.width, c.height), 0, 0);
      placeImage(c.toDataURL('image/png'), c.width, c.height);
    });
}
function decodeHEIC(file){
  return loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js')
    .then(()=> heic2any({blob:file, toType:'image/png'}))
    .then(blob=> new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{ placeImage(fr.result, img.naturalWidth, img.naturalHeight); res(); };
        img.onerror = rej;
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(Array.isArray(blob) ? blob[0] : blob);
    }));
}
function importImage(file){
  const ext = ((file.name.match(/\.([^.]+)$/)||[])[1]||'').toLowerCase();
  const fr = new FileReader();
  fr.onload = ()=>{
    const src = fr.result;
    const img = new Image();
    img.onload = ()=> placeImage(src, img.naturalWidth, img.naturalHeight);
    img.onerror = ()=>{
      // ブラウザが直接表示できない形式は変換を試みる（要ネット接続）
      const fallback =
        (ext==='tif'||ext==='tiff') ? decodeTIFF(file) :
        (ext==='heic'||ext==='heif') ? decodeHEIC(file) :
        Promise.reject(new Error('unsupported'));
      fallback.catch(()=> alert('この画像形式を読み込めませんでした。\nPNG/JPEG/GIF/WebP/BMP/AVIF/SVG は直接、TIFF/HEIC はオンライン時に変換して取り込めます。'));
    };
    img.src = src;
  };
  fr.onerror = ()=> alert('ファイルを読み込めませんでした。');
  fr.readAsDataURL(file);
}
function sanitizeSVGNode(root){
  root.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  let node = walker.currentNode;
  while(node){
    if(node.attributes){
      [...node.attributes].forEach(attr=>{
        if(/^on/i.test(attr.name)) node.removeAttribute(attr.name);
        if(/^(href|xlink:href)$/i.test(attr.name) && /^\s*javascript:/i.test(attr.value)) node.removeAttribute(attr.name);
      });
    }
    node = walker.nextNode();
  }
}
function importSVG(file){
  const fr = new FileReader();
  fr.onload = ()=> importSVGText(fr.result);
  fr.onerror = ()=> alert('ファイルを読み込めませんでした。');
  fr.readAsText(file);
}
function importSVGText(text){
    let holder = null;
    try{
      const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      if(doc.querySelector('parsererror')) throw new Error('parse error');
      const svgRoot = doc.documentElement;
      if(svgRoot.nodeName.toLowerCase() !== 'svg') throw new Error('not svg');
      sanitizeSVGNode(svgRoot); // appendChild前に無害化（挿入後だとscriptが即実行されるため）

      holder = document.createElement('div');
      holder.style.cssText = 'position:absolute; left:-99999px; top:-99999px; width:3000px; height:3000px; overflow:hidden;';
      document.body.appendChild(holder);
      const imported = document.importNode(svgRoot, true);
      holder.appendChild(imported);

      const skipTags = new Set(['defs','clippath','mask','symbol','pattern']);
      const inSkipped = el=>{
        let p = el.parentElement;
        while(p && p!==imported){ if(skipTags.has(p.nodeName.toLowerCase())) return true; p = p.parentElement; }
        return false;
      };
      const newShapes = [];
      imported.querySelectorAll('rect,circle,ellipse,line,polyline,polygon,path').forEach(el=>{
        if(inSkipped(el)) return;
        try{
          const len = el.getTotalLength();
          const ctm = el.getCTM();
          if(!len || !isFinite(len) || !ctm) return;
          const n = clamp(Math.round(len/6), 8, 200);
          const pts = [];
          for(let i=0;i<=n;i++){
            const lp = el.getPointAtLength(len*i/n).matrixTransform(ctm);
            pts.push({x:lp.x, y:lp.y});
          }
          const cs = getComputedStyle(el);
          let fill = el.getAttribute('fill') || cs.fill || '#000000';
          if(fill==='none' || /rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(fill)) fill = 'none';
          let stroke = el.getAttribute('stroke') || cs.stroke || 'none';
          if(stroke==='none' || /rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(stroke)) stroke = 'none';
          const tag = el.nodeName.toLowerCase();
          const dAttr = el.getAttribute('d') || '';
          const closed = ['rect','circle','ellipse','polygon'].includes(tag) || /[Zz]\s*$/.test(dAttr.trim());
          const sw = parseFloat(el.getAttribute('stroke-width') || cs.strokeWidth) || (stroke!=='none' ? 1 : 0);
          const op = clamp(parseFloat(el.getAttribute('opacity') || cs.opacity || '1') || 1, 0, 1);
          newShapes.push(newShape('path', {pts, closed, smooth:false, fill, stroke, strokeWidth:sw, opacity:op}));
        }catch(err){ /* サポート外の要素はスキップ */ }
      });
      imported.querySelectorAll('text').forEach(el=>{
        if(inSkipped(el)) return;
        try{
          const ctm = el.getCTM(); if(!ctm) return;
          const x = parseFloat(el.getAttribute('x')) || 0, y = parseFloat(el.getAttribute('y')) || 0;
          const pt = stage.createSVGPoint(); pt.x = x; pt.y = y;
          const wp = pt.matrixTransform(ctm);
          const scale = Math.hypot(ctm.a, ctm.b) || 1;
          const cs = getComputedStyle(el);
          const size = (parseFloat(el.getAttribute('font-size')) || parseFloat(cs.fontSize) || 16) * scale;
          const weight = el.getAttribute('font-weight') || cs.fontWeight || '400';
          newShapes.push(newShape('text', {
            x:wp.x, y:wp.y, text: el.textContent || '', size,
            font: /serif/i.test(cs.fontFamily) ? 'serif' : /mono/i.test(cs.fontFamily) ? 'monospace' : 'sans-serif',
            // 取り込んだ太さをそのまま保つ（bold扱いに丸めない）
            weight: /bold/i.test(weight) ? 700 : clamp(Math.round((parseInt(weight,10)||400)/100)*100, 100, 900),
            stroke:'none', fill: el.getAttribute('fill') || cs.fill || '#000000',
          }));
        }catch(err){ /* サポート外の要素はスキップ */ }
      });
      imported.querySelectorAll('image').forEach(el=>{
        if(inSkipped(el)) return;
        try{
          const href = el.getAttribute('href') || el.getAttributeNS('http://www.w3.org/1999/xlink','href') || el.getAttribute('xlink:href');
          if(!href) return;
          const ctm = el.getCTM(); if(!ctm) return;
          const x = parseFloat(el.getAttribute('x')) || 0, y = parseFloat(el.getAttribute('y')) || 0;
          const w = parseFloat(el.getAttribute('width')) || 0, h = parseFloat(el.getAttribute('height')) || 0;
          const corners = [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([px,py])=>{
            const pt = stage.createSVGPoint(); pt.x = px; pt.y = py;
            return pt.matrixTransform(ctm);
          });
          const xs = corners.map(c=>c.x), ys = corners.map(c=>c.y);
          const nx = Math.min(...xs), ny = Math.min(...ys);
          newShapes.push(newShape('image', {x:nx, y:ny, w:Math.max(...xs)-nx, h:Math.max(...ys)-ny, src:href}));
        }catch(err){ /* サポート外の要素はスキップ */ }
      });

      if(!newShapes.length){ alert('読み込めるオブジェクトが見つかりませんでした。'); return; }
      pushHistory();
      state.shapes.push(...newShapes);
      state.sel = new Set(newShapes.map(s=>s.id));
      render();
    }catch(err){
      alert('SVGファイルを読み込めませんでした。');
    }finally{
      if(holder) document.body.removeChild(holder);
    }
}

/* ---- 自動保存 ---- */
const AUTOSAVE_KEY = 'vector-koubou-autosave';
let autosaveTimer = null;
function autosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({app:'vector-koubou', version:1,
        fname:$('fname').value, doc:state.doc, shapes:state.shapes, layers:state.layers,
        activeLayer:state.activeLayer, idSeq, groupSeq, layerSeq, guides:state.guides,
        webFonts:state.webFonts, customFonts:state.customFonts}));
    }catch(err){ /* 容量超過などで保存できない場合も動作は継続する */ }
  }, 400);
}
function restoreAutosave(){
  try{
    const data = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));
    if(!data || !Array.isArray(data.shapes) || !data.shapes.length) return false;
    state.doc = data.doc || state.doc;
    state.shapes = data.shapes;
    backfillImageNat();
    ensureProjectFonts();
    state.layers = Array.isArray(data.layers) ? data.layers : [];
    state.activeLayer = data.activeLayer || null;
    state.guides = data.guides || {v:[], h:[]};
    idSeq = data.idSeq || (Math.max(0,...state.shapes.map(s=>s.id))+1);
    groupSeq = data.groupSeq || 1;
    layerSeq = data.layerSeq || (Math.max(0,...state.layers.map(l=>+String(l.id).replace(/\D/g,'')||0))+1);
    ensureLayers();
    state.webFonts = Array.isArray(data.webFonts) ? data.webFonts : [];
    state.customFonts = Array.isArray(data.customFonts) ? data.customFonts : [];
    reloadFonts();
    if(data.fname) $('fname').value = data.fname;
    return true;
  }catch(err){ return false; }
}

/* ================= キーボード ================= */
window.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  const ctrl = e.ctrlKey || e.metaKey;
  if(e.code==='Space'){ spaceDown = true; stage.classList.add('tool-hand'); e.preventDefault(); return; }
  if(ctrl){
    const k = e.key.toLowerCase();
    if(k==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if(k==='y'){ e.preventDefault(); redo(); return; }
    if(k==='c'){ e.preventDefault(); copySel(); return; }
    // Ctrl+V は document の paste イベント側で処理（外部クリップボード対応のため）
    if(k==='d'){ e.preventDefault(); duplicateSel(); return; }
    if(k==='g'){ e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); return; }
    if(k==='a'){ e.preventDefault(); state.sel = new Set(state.shapes.filter(s=>shapeVisible(s)&&!shapeLocked(s)).map(s=>s.id)); render(); return; }
    if(e.key==='=' || e.key==='+'){ e.preventDefault(); zoomAt(1.2); return; }
    if(e.key==='-'){ e.preventDefault(); zoomAt(1/1.2); return; }
    if(e.key==='0'){ e.preventDefault(); zoomFit(); return; }
    if(k==='s'){ e.preventDefault(); saveJSON(); return; }
    return;
  }
  const toolKeys = {v:'select', a:'node', r:'rect', e:'ellipse', l:'line', p:'poly', s:'star', n:'pen', b:'pencil', t:'text', i:'picker', h:'hand'};
  const tk = toolKeys[e.key.toLowerCase()];
  if(tk){ setTool(tk); return; }
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key==='Escape'){
    if(pen){ pen=null; overlayRenderPen(); }
    else { state.sel.clear(); render(); }
    return;
  }
  if(e.key==='Enter'){ if(pen && pen.pts.length>=2){ finishPen(false); render(); } return; }
  if(e.key.startsWith('Arrow') && state.sel.size){
    e.preventDefault();
    pushHistory();
    const d = e.shiftKey ? 10 : 1;
    const dx = e.key==='ArrowLeft' ? -d : e.key==='ArrowRight' ? d : 0;
    const dy = e.key==='ArrowUp' ? -d : e.key==='ArrowDown' ? d : 0;
    selShapes().forEach(s=> translateShape(s, JSON.parse(JSON.stringify(s)), dx, dy));
    render();
  }
});
window.addEventListener('keyup', e=>{
  if(e.code==='Space'){ spaceDown = false; if(state.tool!=='hand') stage.classList.remove('tool-hand'); }
});

/* ---- クリップボード貼り付け（画像・SVGコード・内部コピー） ---- */
document.addEventListener('paste', e=>{
  const tag = ((document.activeElement && document.activeElement.tagName) || '').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  const cd = e.clipboardData;
  if(cd){
    for(const item of cd.items){
      if(item.type && item.type.startsWith('image/')){
        const f = item.getAsFile();
        if(f){ e.preventDefault(); importImage(f); return; }
      }
    }
    const text = cd.getData('text/plain') || '';
    if(text.startsWith('vector-koubou:')){ e.preventDefault(); pasteShapesJSON(text.slice('vector-koubou:'.length)); return; }
    if(/<svg[\s>]/i.test(text)){ e.preventDefault(); importSVGText(text); return; }
  }
  paste(); // 外部コンテンツがなければ内部クリップボードから複製
});

/* ================= 上部バーのイベント ================= */
$('btnNew').onclick = ()=>{
  if(state.shapes.length && !confirm('現在のデザインを破棄して新規作成しますか？（保存していない内容は失われます）')) return;
  state.shapes = []; state.sel.clear(); undoStack.length=0; redoStack.length=0;
  state.guides = {v:[], h:[]};
  state.layers = []; state.activeLayer = null; layerSeq = 1; ensureLayers();
  try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(err){}
  $('fname').value = '無題のデザイン';
  zoomFit();
};
$('fname').oninput = autosave;
$('btnOpen').onclick = ()=> $('fileInput').click();
$('fileInput').onchange = e=>{ if(e.target.files[0]) openJSON(e.target.files[0]); e.target.value=''; };
$('btnImport').onclick = ()=> $('importInput').click();
$('importInput').onchange = e=>{ if(e.target.files[0]) importFile(e.target.files[0]); e.target.value=''; };
$('btnSave').onclick = saveJSON;
$('btnExport').onclick = e=>{
  e.stopPropagation();
  const m = $('exportMenu');
  m.style.display = (m.style.display==='flex') ? 'none' : 'flex';
  if(m.style.display==='flex') updateExportHint();
};
$('expScale').onchange = updateExportHint;
// 解像度の選択中にメニューが閉じないようにする
$('exportMenu').onclick = e=> e.stopPropagation();
document.addEventListener('click', ()=>{ $('exportMenu').style.display = 'none'; });
$('exportMenu').querySelectorAll('[data-fmt]').forEach(btn=>{
  btn.onclick = ()=>{
    $('exportMenu').style.display = 'none';
    ({svg:exportSVG, png:exportPNG, jpeg:exportJPEG, pdf:exportPDF})[btn.dataset.fmt]();
  };
});
$('btnUndo').onclick = undo;
$('btnRedo').onclick = redo;
$('btnZoomIn').onclick = ()=> zoomAt(1.2);
$('btnZoomOut').onclick = ()=> zoomAt(1/1.2);
$('btnFit').onclick = zoomFit;
$('chkGrid').onchange = e=>{ state.grid = e.target.checked; render(); };
$('chkSnap').onchange = e=>{ state.snap = e.target.checked; };
$('chkRuler').onchange = e=>{ state.ruler = e.target.checked; renderChrome(); };
$('chkKeepTool').onchange = e=>{ state.keepTool = e.target.checked; };
$('btnAddLayer').onclick = addLayer;
$('fontInput').onchange = e=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    const name = f.name.replace(/\.[^.]+$/,'');
    registerCustomFont({name, data:fr.result}).then(()=>{
      state.customFonts = state.customFonts || [];
      if(!state.customFonts.find(c=>c.name===name)) state.customFonts.push({name, data:fr.result});
      const one = selShapes()[0];
      if(one && (one.type==='text' || isFrameShape(one))){ pushHistory(); one.font = name; }
      render();
      $('hint').textContent = 'フォント「'+name+'」を読み込みました';
    }).catch(()=> alert('フォントファイルを読み込めませんでした。'));
  };
  fr.onerror = ()=> alert('ファイルを読み込めませんでした。');
  fr.readAsDataURL(f);
};
// 画像・SVG・JSONのドラッグ&ドロップ取り込み
$('canvasWrap').addEventListener('dragover', e=> e.preventDefault());
$('canvasWrap').addEventListener('drop', e=>{
  e.preventDefault();
  [...e.dataTransfer.files].forEach(importFile);
});
// iOS Safariのページ全体ピンチズームを抑止（キャンバス側で処理する）
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t, e=> e.preventDefault()));
// Webフォント読み込み完了時に再レイアウト（折返し計算がフォント寸法に依存するため）
if(document.fonts && document.fonts.addEventListener)
  document.fonts.addEventListener('loadingdone', ()=> render(true));

/* ================= 起動 ================= */
buildToolbar();
setTool('select');
window.addEventListener('resize', updateWorld);
const restored = restoreAutosave();
zoomFit();
if(restored) $('hint').textContent = '前回の作業内容を復元しました（自動保存）';
</script>
